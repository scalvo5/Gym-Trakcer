<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Tracker Allenamenti</title>
<style>
:root{--bg:#f6f6f4;--surface:#ffffff;--raise:#f0f0ed;--line:#e6e6e2;--text:#0b0b0b;--muted:#83837d;--accent:#c8f23c;--ink:#0b0b0b;--good:#1f9d55;--warn:#c98a0c;--danger:#d64535;--r:18px}
@media (prefers-color-scheme: dark){:root{--bg:#0a0a0a;--surface:#141414;--raise:#1d1d1d;--line:#262626;--text:#f4f4f2;--muted:#8b8b86;--accent:#d4ff3f;--ink:#0a0a0a;--good:#4ade80;--warn:#fbbf24;--danger:#f87171}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 18px) 18px 10px;max-width:720px;margin:0 auto}
h1{font-size:30px;margin:0;letter-spacing:-.03em;font-weight:750}
h2{font-size:18px;margin:0 0 10px;letter-spacing:-.015em;font-weight:700}
main{padding:0 18px calc(104px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}.small{font-size:13.5px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.sp{height:22px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav button{flex:1;max-width:110px;background:none;border:0;color:var(--muted);padding:6px 0;font:inherit;font-size:10px;font-weight:600;letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--text)}
nav button.on svg{stroke-width:2.3}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:10px 0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:0;background:var(--raise);border-radius:999px;height:44px;padding:0 18px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--ink)}
.btn.dark{background:var(--text);color:var(--bg)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.danger{color:var(--danger);background:none;border:1px solid var(--line)}
.btn.block{width:100%;height:52px;font-size:16px}
.btn.sm{height:34px;padding:0 14px;font-size:13.5px}
.btn:disabled{opacity:.4}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.tile{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:18px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);margin:8px 0}
.tile b{font-size:18px;letter-spacing:-.01em}
.arrow{color:var(--muted);font-size:20px}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--raise);border:1px solid transparent;border-radius:12px;padding:12px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--text)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
label.f{display:block;margin:12px 0 6px}
.ex{transition:border-color .15s}
.ex.done{border-color:var(--good)}
.ex-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-name{font-size:17px;font-weight:700;letter-spacing:-.01em}
.meta{font-size:13px;color:var(--muted);margin-top:3px}
.meta b{color:var(--text);font-weight:600}
.trio{display:grid;grid-template-columns:1fr 1fr 1fr 48px;gap:8px;margin-top:14px;align-items:end}
.trio .lbl{text-align:center;display:block;margin-bottom:5px}
.trio input{text-align:center;font-size:22px;font-weight:650;height:56px;padding:6px 2px;font-variant-numeric:tabular-nums}
.ok{height:56px;border-radius:14px;border:1px solid var(--line);background:none;font-size:20px;color:var(--muted)}
.ex.done .ok{background:var(--good);border-color:var(--good);color:#fff}
.dots{width:36px;height:36px;border-radius:50%;border:0;background:var(--raise);color:var(--muted);font-size:18px;line-height:1;flex:none}
.dots.on{background:var(--text);color:var(--bg)}
.menu{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0}
.opt span{font-size:15px;font-weight:550}
.sw{position:relative;width:46px;height:28px;border-radius:99px;background:var(--raise);border:1px solid var(--line);flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s}
.sw.on{background:var(--accent);border-color:var(--accent)}
.sw.on::after{transform:translateX(18px);background:var(--ink)}
.opt select{width:auto;max-width:60%;padding:8px 10px;font-size:14px}
.reps{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-top:12px}
.reps div{display:flex;flex-direction:column;gap:4px}
.reps .lbl{text-align:center}
.reps input{text-align:center;font-size:18px;font-weight:650;height:46px;padding:4px}
.drop{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:center;margin-top:12px}
.drop input{text-align:center;font-weight:650;height:46px}
.ss{position:relative;padding-left:14px;margin:16px 0}
.ss::before{content:"";position:absolute;left:0;top:30px;bottom:12px;width:3px;border-radius:3px;background:var(--accent)}
.ss>.lbl{color:var(--text);display:block;margin-bottom:-2px}
.ss .card{margin:8px 0}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--raise);border-radius:14px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}
details.card summary{list-style:none;cursor:pointer}
details.card summary::-webkit-details-marker{display:none}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.line:first-child{border-top:0}
canvas{width:100%;height:190px;display:block}
.ico{border:0;background:var(--raise);border-radius:10px;width:34px;height:34px;font-size:13px;color:var(--muted);flex:none}
.ico.on{background:var(--accent);color:var(--ink)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;vertical-align:2px}
.seg{display:flex;background:var(--raise);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text)}
.bar{height:6px;background:var(--raise);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--text);border-radius:99px}
.score{display:flex;align-items:flex-end;gap:14px;margin:6px 0 4px}
.score b{font-size:64px;line-height:.9;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.score span{font-size:15px;color:var(--muted);padding-bottom:6px}
.part{margin-top:14px}
.part .row{font-size:14px}
ul.clean{list-style:none;padding:0;margin:0}
ul.clean li{padding:10px 0;border-top:1px solid var(--line);font-size:14.5px;display:flex;gap:10px}
ul.clean li:first-child{border-top:0}
.good{color:var(--good)}.bad{color:var(--warn)}
.result{background:var(--raise);border-radius:12px;padding:12px;margin-top:12px;font-size:14.5px}
.add{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
#lock[hidden]{display:none}
#lock .card{width:100%;max-width:340px;text-align:center;padding:24px}
</style>
</head>
<body>
<header><h1 id="title">Home</h1></header>
<main id="main"></main>
<div id="toast"></div>

<div id="lock" hidden>
  <div class="card">
    <h2>Tracker bloccato</h2>
    <div id="bioBox"><p></p><button class="btn primary block" data-a="biounlock">Sblocca con impronta / volto</button></div>
    <div id="pinBox"><p class="muted small" id="pinLbl">Inserisci il PIN</p>
      <input id="pinIn" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" style="text-align:center"><p></p>
      <button class="btn dark block" data-a="unlock">Sblocca con PIN</button></div>
  </div>
</div>

<nav>
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>Home</button>
  <button data-tab="train"><svg viewBox="0 0 24 24"><path d="M3 10v4M6.5 7v10M17.5 7v10M21 10v4M6.5 12h11"/></svg>Allena</button>
  <button data-tab="db"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>Esercizi</button>
  <button data-tab="cardio"><svg viewBox="0 0 24 24"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>Cardio</button>
  <button data-tab="body"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></svg>Obiettivi</button>
  <button data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>Altro</button>
</nav>

<script>
'use strict';
const KEY = 'tracker_allenamenti_v1';
const VERSION = 3;
const MUSCLES = ['Petto', 'Dorso', 'Spalle', 'Bicipiti', 'Tricipiti', 'Quadricipiti', 'Femorali', 'Glutei', 'Polpacci', 'Core'];
const MAIN_GROUPS = ['Petto', 'Dorso', 'Spalle', 'Bicipiti', 'Tricipiti', 'Quadricipiti', 'Femorali', 'Glutei'];
const DAY = 86400000;

/* ---------------- database esercizi ---------------- */
const DB = {
  Petto: ['Panca piana con bilanciere', 'Panca piana con manubri', 'Spinte manubri su panca inclinata', 'Panca inclinata con bilanciere', 'Panca declinata', 'Chest press', 'Chest press inclinata', 'Croci con manubri', 'Croci ai cavi', 'Pec deck', 'Dip alle parallele', 'Piegamenti a terra'],
  Dorso: ['Trazioni alla sbarra', 'Lat machine', 'Lat machine presa stretta', 'Pulley basso', 'Rematore con manubrio', 'Rematore con bilanciere', 'Rematore T-bar', 'Rematore alla macchina', 'Pulldown a braccia tese', 'Pullover al cavo', 'Hyperextension'],
  Spalle: ['Military press', 'Shoulder press con manubri', 'Shoulder press alla macchina', 'Arnold press', 'Alzate laterali con manubri', 'Alzate laterali al cavo basso', 'Alzate laterali alla macchina', 'Alzate posteriori', 'Reverse pec deck', 'Face pull', 'Tirate al mento'],
  Bicipiti: ['Curl con manubri', 'Curl con bilanciere', 'Curl a martello', 'Curl su panca inclinata', 'Curl concentrato', 'Curl alla panca Scott', 'Curl al cavo', 'Curl con bilanciere EZ'],
  Tricipiti: ['Pushdown con corda', 'Pushdown con barra', 'French press', 'Estensioni sopra la testa con manubrio', 'Estensioni sopra la testa al cavo', 'Panca presa stretta', 'Dip alla panca', 'Kickback'],
  Quadricipiti: ['Squat con bilanciere', 'Front squat', 'Goblet squat', 'Hack squat', 'Leg press', 'Leg extension', 'Affondi camminati con manubri', 'Affondi bulgari', 'Step up', 'Pendulum squat'],
  Femorali: ['Stacchi rumeni', 'Stacco da terra', 'Leg curl sdraiato', 'Leg curl seduto', 'Leg curl in piedi', 'Good morning', 'Nordic curl', 'Glute ham raise'],
  Glutei: ['Hip thrust', 'Hip thrust alla macchina', 'Glute bridge', 'Abductor machine', 'Kickback al cavo', 'Slanci posteriori alla macchina', 'Sumo squat con manubrio'],
  Polpacci: ['Calf in piedi', 'Calf machine', 'Calf seduto', 'Calf alla leg press', 'Calf monopodalico'],
  Core: ['Plank', 'Plank laterale', 'Crunch', 'Crunch al cavo', 'Dead bug', 'Bird dog', 'Pallof press', 'Sollevamento gambe', 'Ab wheel', 'Russian twist']
};
const SEC_EX = /plank|tenuta|wall sit|hollow/i;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const fmt = v => { const r = Math.round(v * 10) / 10; return Number.isInteger(r) ? String(r) : r.toFixed(1).replace('.', ','); };
const e1rm = s => s.kg > 0 && s.reps > 0 ? s.kg * (1 + s.reps / 30) : 0;
const best = sets => sets.reduce((a, s) => Math.max(a, e1rm(s)), 0);
const dLong = ts => new Date(ts).toLocaleDateString('it-IT', {weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'});
const dShort = ts => new Date(ts).toLocaleDateString('it-IT', {day: 'numeric', month: 'short'});
const dur = ms => { const m = Math.max(0, Math.round(ms / 60000)); return m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m + ' min'; };
const pace = kmh => { if (!(kmh > 0)) return '–'; const s = Math.round(3600 / kmh); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const isoDay = ts => { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const dayTs = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d, 12).getTime(); };
function weekStart(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.getTime(); }

function dbMuscle(name) {
  const l = name.toLowerCase();
  for (const m of MUSCLES) if (DB[m].some(x => x.toLowerCase() === l)) return m;
  return null;
}
function guessMuscle(n) {
  const known = dbMuscle(n); if (known) return known;
  const s = n.toLowerCase();
  const R = [
    [/leg ext|squat|affond|pressa|leg press|quadric|hack|step/, 'Quadricipiti'],
    [/leg curl|femoral|rumen|stacc|nordic|good morning/, 'Femorali'],
    [/hip thrust|glute|abductor|abduct|kickback al cavo|ponte|bridge/, 'Glutei'],
    [/calf|polpacc/, 'Polpacci'],
    [/push ?down|french|tricip|skull|estensioni|kickback/, 'Tricipiti'],
    [/curl|bicip/, 'Bicipiti'],
    [/shoulder|alzate|military|lento|face pull|deltoid|spalle|arnold|overhead/, 'Spalle'],
    [/chest|panca|croci|pec|petto|push ?up|piegament|dip/, 'Petto'],
    [/lat|pulley|rematore|row|trazion|pulldown|dorso|pullover/, 'Dorso'],
    [/crunch|plank|addom|core|dead bug|ab wheel/, 'Core']
  ];
  for (const [re, m] of R) if (re.test(s)) return m;
  return 'Core';
}
const T = (name, muscle, sets, reps, rest, note = '', unit = '') => ({name, muscle, sets, reps, rest, note, unit, ss: false});
function defaultTemplates() {
  return [
    {id: uid(), name: 'Upper A', exercises: [
      T('Panca piana con bilanciere', 'Petto', 4, '6-8', "2'30\"", '2 RIR'),
      T('Trazioni alla sbarra o Lat machine', 'Dorso', 4, '8', "2'"),
      T('Spinte manubri su panca inclinata', 'Petto', 3, '10', '90"'),
      T('Rematore con manubrio', 'Dorso', 3, '10', '90"'),
      T('Alzate laterali con manubri', 'Spalle', 3, '12-15', '60"'),
      T('Curl con manubri', 'Bicipiti', 3, '12', '60"')]},
    {id: uid(), name: 'Lower A', exercises: [
      T('Squat con bilanciere', 'Quadricipiti', 4, '6-8', "2'30\"", '2 RIR'),
      T('Stacchi rumeni', 'Femorali', 4, '8-10', "2'"),
      T('Leg press', 'Quadricipiti', 3, '10-12', '90"'),
      T('Leg curl', 'Femorali', 3, '12', '60"'),
      T('Calf machine', 'Polpacci', 4, '12-15', '60"'),
      T('Crunch', 'Core', 3, '15', '60"')]},
    {id: uid(), name: 'Upper B', exercises: [
      T('Military press', 'Spalle', 4, '6-8', "2'30\""),
      T('Pulley basso', 'Dorso', 4, '8-10', "2'"),
      T('Chest press o Dip alle parallele', 'Petto', 3, '10', '90"'),
      T('Alzate laterali al cavo basso', 'Spalle', 3, '12-15', '60"'),
      T('Pushdown con corda', 'Tricipiti', 3, '12', '60"')]},
    {id: uid(), name: 'Lower B', exercises: [
      T('Affondi camminati con manubri', 'Quadricipiti', 3, '10', '90"', 'per gamba'),
      T('Leg extension', 'Quadricipiti', 3, '12-15', '60"'),
      T('Hip thrust', 'Glutei', 4, '10', "2'"),
      T('Calf in piedi', 'Polpacci', 4, '12', '60"'),
      T('Plank', 'Core', 3, '60', '60"', 'max tenuta', 'sec')]}
  ];
}
function tplEx(x) {
  if (typeof x === 'string') x = {name: x};
  return {name: x.name, muscle: MUSCLES.includes(x.muscle) ? x.muscle : guessMuscle(x.name), sets: Math.max(1, Math.round(num(x.sets)) || 3), reps: x.reps != null ? String(x.reps) : '10', rest: x.rest || '90"', note: x.note || '', unit: x.unit || (SEC_EX.test(x.name) ? 'sec' : ''), ss: !!x.ss};
}
function defaults() {
  return {version: VERSION, templates: defaultTemplates(), sessions: [], cardio: [], weights: [], bf: [], customEx: [],
    goals: {weight: null, bf: null, date: null, sessionsWeek: 4, cardioMin: 90}, settings: {pin: null, bio: null}, active: null};
}

let S;
function normalize(d) {
  const base = defaults();
  d = (d && typeof d === 'object') ? d : base;
  const old = (d.version || 1) < 3;
  d.templates = old || !Array.isArray(d.templates) ? base.templates : d.templates.map(t => ({id: t.id || uid(), name: t.name || 'Scheda', exercises: (t.exercises || []).map(tplEx)}));
  d.sessions = (Array.isArray(d.sessions) ? d.sessions : []).map(s => ({...s, exercises: (s.exercises || []).map(e => ({name: e.name, muscle: MUSCLES.includes(e.muscle) ? e.muscle : guessMuscle(e.name), ss: !!e.ss, ...(e.unit ? {unit: e.unit} : {}), sets: (e.sets || []).map(x => ({kg: num(x.kg), reps: Math.round(num(x.reps)), ...(x.drop ? {drop: true} : {})}))}))}));
  d.cardio = Array.isArray(d.cardio) ? d.cardio : [];
  d.weights = Array.isArray(d.weights) ? d.weights : [];
  d.bf = Array.isArray(d.bf) ? d.bf : [];
  d.customEx = Array.isArray(d.customEx) ? d.customEx : [];
  d.goals = Object.assign({}, base.goals, d.goals || {});
  d.settings = {pin: (d.settings || {}).pin || null, bio: (d.settings || {}).bio || null};
  if (d.active && (old || !d.active.exercises || d.active.exercises.some(e => Array.isArray(e.sets)))) {
    d.active = {start: d.active.start || Date.now(), name: d.active.name || 'Allenamento', notes: d.active.notes || '', exercises: (d.active.exercises || []).map(e => sessEx(tplEx({name: e.name, muscle: e.muscle})))};
  }
  d.version = VERSION;
  return d;
}
function load() { try { const r = localStorage.getItem(KEY); S = normalize(r ? JSON.parse(r) : null); } catch (e) { S = normalize(null); } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Impossibile salvare i dati'); } }

let tab = 'home', more = 'progress', preview = null, cardioType = 'corsa', progEx = null, progMetric = 'e1';
let dbQ = '', dbM = 'Tutti', dbOpen = null;

/* ---------------- calcoli ---------------- */
function lastFor(name) {
  for (let i = S.sessions.length - 1; i >= 0; i--) {
    const ex = S.sessions[i].exercises.find(e => e.name.toLowerCase() === name.toLowerCase());
    if (ex) return {date: S.sessions[i].date, sets: ex.sets, unit: ex.unit};
  }
  return null;
}
function lastSummary(name) {
  const l = lastFor(name); if (!l) return null;
  const main = l.sets.filter(s => !s.drop); if (!main.length) return null;
  const kg = Math.max(...main.map(s => s.kg));
  const reps = main.map(s => s.reps), same = reps.every(r => r === reps[0]);
  return {date: l.date, sets: main.length, reps: reps[0], repsTxt: same ? String(reps[0]) : reps.join('/'), kg, unit: l.unit};
}
function bestEver(name) {
  let b = 0;
  S.sessions.forEach(s => s.exercises.forEach(e => { if (e.name.toLowerCase() === name.toLowerCase()) b = Math.max(b, best(e.sets)); }));
  return b;
}
function allExercises() {

  S.customEx.forEach(x => { if (!list.some(y => y.name.toLowerCase() === x.name.toLowerCase())) list.push({name: x.name, muscle: x.muscle, custom: true}); });
  return list;
}
function muscleOf(name) {

  const c = S.customEx.find(x => x.name.toLowerCase() === name.toLowerCase()); if (c) return c.muscle;
  return guessMuscle(name);
}
function sessEx(t) {

    sets: '', reps: '', kg: '', perSet: false, repsList: [], drop: null, ss: !!t.ss, open: false, done: false};
}
const unitLbl = e => e.unit === 'sec' ? 'sec' : 'rip';
const setsText = (sets, unit) => sets.map(s => (s.drop ? '↘ ' : '') + (s.kg ? fmt(s.kg) + ' kg × ' : '') + s.reps + (unit === 'sec' ? 's' : '')).join(' · ');
function ssGroups(exs) {
  const g = []; let open = false;
  exs.forEach((e, i) => { if (open) g[g.length - 1].push(i); else g.push([i]); open = !!e.ss && i < exs.length - 1; });
  return g;
}
const inSS = (exs, i) => !!(exs[i].ss && i < exs.length - 1) || (i > 0 && !!exs[i - 1].ss);
function latest(arr) { return arr.length ? [...arr].sort((a, b) => a.date - b.date)[arr.length - 1] : null; }
function trendPerDay(arr, days = 28) {
  const pts = arr.filter(x => x.date >= Date.now() - days * DAY).sort((a, b) => a.date - b.date);
  if (pts.length < 2 || pts[pts.length - 1].date - pts[0].date < 5 * DAY) return null;
  const n = pts.length, mx = pts.reduce((a, p) => a + p.date, 0) / n, my = pts.reduce((a, p) => a + p.v, 0) / n;
  let sxy = 0, sxx = 0; pts.forEach(p => { sxy += (p.date - mx) * (p.v - my); sxx += (p.date - mx) ** 2; });
  return sxx ? sxy / sxx * DAY : null;
}
function nextTemplate() {
  if (!S.templates.length) return null;
  const last = [...S.sessions].reverse().find(s => S.templates.some(t => t.name === s.name));
  if (!last) return S.templates[0];
  const i = S.templates.findIndex(t => t.name === last.name);
  return S.templates[(i + 1) % S.templates.length];
}

function weekEval(ws) {
  const we = ws + 7 * DAY, g = S.goals;
  const ss = S.sessions.filter(s => s.date >= ws && s.date < we);
  const cm = S.cardio.filter(c => c.date >= ws && c.date < we).reduce((a, c) => a + c.min, 0);
  const freq = Math.min(1, ss.length / (g.sessionsWeek || 4));
  let comp = 0, imp = 0;
  ss.forEach(s => s.exercises.forEach(e => {
    const now = best(e.sets); if (!now) return;
    let prev = 0;
    S.sessions.filter(p => p.date < ws && p.date >= ws - 35 * DAY).forEach(p => p.exercises.forEach(x => { if (x.name === e.name) prev = Math.max(prev, best(x.sets)); }));
    if (prev > 0) { comp++; if (now >= prev * 0.99) imp++; }
  }));
  const prog = comp ? imp / comp : (ss.length ? 0.5 : 0);
  const mg = new Set(); ss.forEach(s => s.exercises.forEach(e => mg.add(e.muscle)));
  const covered = MAIN_GROUPS.filter(x => mg.has(x)).length;
  const car = g.cardioMin ? Math.min(1, cm / g.cardioMin) : 1;
  const parts = [
    {name: 'Frequenza', v: freq, max: 40, txt: `${ss.length} di ${g.sessionsWeek} allenamenti`, tip: 'allenati più spesso'},
    {name: 'Progressione', v: prog, max: 30, txt: comp ? `${imp} di ${comp} esercizi stabili o in crescita` : 'nessun confronto con le settimane precedenti', tip: 'aumenta carichi o ripetizioni'},
    {name: 'Equilibrio', v: covered / MAIN_GROUPS.length, max: 15, txt: `${covered} di 8 gruppi muscolari`, tip: 'allena anche i gruppi trascurati'},
    {name: 'Cardio', v: car, max: 15, txt: `${cm} di ${g.cardioMin} min`, tip: 'aggiungi minuti di cardio'}
  ];
  const score = Math.round(parts.reduce((a, p) => a + p.v * p.max, 0));
  const label = score >= 85 ? 'Ottima' : score >= 70 ? 'Buona' : score >= 50 ? 'Sufficiente' : 'Da migliorare';
  const weak = [...parts].sort((a, b) => a.v - b.v)[0];
  return {score, label, parts, tip: weak.v < 0.8 ? weak.tip : null};
}

function strengthsWeak() {
  const now = Date.now(), recent = S.sessions.filter(s => s.date >= now - 28 * DAY);
  if (recent.length < 3) return {ready: false, forti: [], deboli: []};
  const st = {}; MAIN_GROUPS.forEach(g => st[g] = {sets: 0, tr: []});
  recent.forEach(s => s.exercises.forEach(e => { if (st[e.muscle]) st[e.muscle].sets += e.sets.filter(x => !x.drop).length; }));
  const byEx = {};
  S.sessions.filter(s => s.date >= now - 42 * DAY).forEach(s => s.exercises.forEach(e => { const b = best(e.sets); if (b) (byEx[e.name] = byEx[e.name] || {m: e.muscle, v: []}).v.push(b); }));
  const exTr = [];
  Object.entries(byEx).forEach(([n, x]) => { if (x.v.length >= 2) { const t = (Math.max(...x.v.slice(-2)) - x.v[0]) / x.v[0]; exTr.push({n, t}); if (st[x.m]) st[x.m].tr.push(t); } });
  const forti = [], deboli = [];
  MAIN_GROUPS.forEach(g => {
    const wk = st[g].sets / 4, tr = st[g].tr.length ? st[g].tr.reduce((a, b) => a + b, 0) / st[g].tr.length : null;
    if (tr !== null && tr > 0.03) forti.push({s: tr, t: `<b>${g}</b> — carichi in crescita (+${fmt(tr * 100)}%)`});
    else if (wk >= 10) forti.push({s: wk / 100, t: `<b>${g}</b> — volume solido (~${fmt(wk)} serie/sett.)`});
    if (wk < 4) deboli.push({s: -wk, t: `<b>${g}</b> — poco allenato (~${fmt(wk)} serie/sett.)`});
    else if (tr !== null && tr <= 0) deboli.push({s: -10 + tr, t: `<b>${g}</b> — carichi fermi nelle ultime settimane`});
  });
  exTr.sort((a, b) => b.t - a.t);
  if (exTr[0] && exTr[0].t > 0.05) forti.unshift({s: 9, t: `Miglior progresso: <b>${esc(exTr[0].n)}</b> (+${fmt(exTr[0].t * 100)}%)`});
  const w = latest(S.weights), tw = trendPerDay(S.weights.map(x => ({date: x.date, v: x.kg})));
  if (S.goals.weight && w && tw !== null) {
    const dir = Math.sign(S.goals.weight - w.kg);
    if (dir !== 0 && Math.sign(tw) === dir) forti.push({s: 1, t: `<b>Peso</b> — nella direzione dell'obiettivo (${tw > 0 ? '+' : ''}${fmt(tw * 7)} kg/sett.)`});
    else if (dir !== 0) deboli.push({s: 1, t: `<b>Peso</b> — non si muove verso l'obiettivo`});
  }
  forti.sort((a, b) => b.s - a.s); deboli.sort((a, b) => b.s - a.s);
  return {ready: true, forti: forti.slice(0, 4).map(x => x.t), deboli: deboli.slice(0, 4).map(x => x.t)};
}

function goalInfo(kind) {
  const isW = kind === 'weight', arr = (isW ? S.weights : S.bf).map(x => ({date: x.date, v: isW ? x.kg : x.pct}));
  const target = isW ? S.goals.weight : S.goals.bf;
  if (!arr.length) return {empty: true, target};
  const sorted = [...arr].sort((a, b) => a.date - b.date), cur = sorted[sorted.length - 1].v, start = sorted[0].v;
  const r = {cur, start, target};
  r.trend = trendPerDay(arr);
  if (target != null) {
    const tot = Math.abs(start - target);
    r.pct = tot ? Math.max(0, Math.min(1, 1 - Math.abs(cur - target) / tot)) : (cur === target ? 1 : 0);
    r.left = target - cur;
    if (S.goals.date) { const wks = (dayTs(S.goals.date) - Date.now()) / (7 * DAY); r.weeks = wks; if (wks > 0) r.need = r.left / wks; }
    if (r.trend && Math.sign(r.trend) === Math.sign(r.left) && Math.abs(r.left) > 0.05) r.eta = Date.now() + r.left / r.trend * DAY;
  }
  return r;
}

/* ---------------- grafici ---------------- */
function drawChart(cv, pts) {
  if (!cv) return;
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  const c = cv.getContext('2d'); c.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement), col = k => cs.getPropertyValue(k).trim();
  c.clearRect(0, 0, w, h); c.font = '11px -apple-system,system-ui,sans-serif';
  if (!pts.length) { c.fillStyle = col('--muted'); c.textAlign = 'center'; c.fillText('Nessun dato ancora', w / 2, h / 2); return; }
  const pl = 38, pr = 8, pt = 10, pb = 22, xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= DAY; x1 += DAY; }
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = (y1 - y0) * 0.15 || Math.max(1, y1 * 0.05); y0 -= pad; y1 += pad;
  const X = x => pl + (x - x0) / (x1 - x0) * (w - pl - pr), Y = y => pt + (1 - (y - y0) / (y1 - y0)) * (h - pt - pb);
  c.strokeStyle = col('--line'); c.fillStyle = col('--muted'); c.lineWidth = 1; c.textAlign = 'right'; c.textBaseline = 'middle';
  for (let i = 0; i <= 3; i++) { const v = y0 + (y1 - y0) * i / 3, yy = Y(v); c.beginPath(); c.moveTo(pl, yy); c.lineTo(w - pr, yy); c.stroke(); c.fillText(fmt(v), pl - 6, yy); }
  c.textBaseline = 'alphabetic'; c.textAlign = 'left'; c.fillText(dShort(Math.min(...xs)), pl, h - 5);
  if (pts.length > 1) { c.textAlign = 'right'; c.fillText(dShort(Math.max(...xs)), w - pr, h - 5); }
  c.strokeStyle = col('--text'); c.lineWidth = 2; c.lineJoin = 'round'; c.beginPath();
  pts.forEach((p, i) => i ? c.lineTo(X(p.x), Y(p.y)) : c.moveTo(X(p.x), Y(p.y))); c.stroke();
  const lp = pts[pts.length - 1];
  c.fillStyle = col('--text'); pts.forEach(p => { c.beginPath(); c.arc(X(p.x), Y(p.y), 2.5, 0, Math.PI * 2); c.fill(); });
  c.fillStyle = col('--accent'); c.strokeStyle = col('--text'); c.lineWidth = 2; c.beginPath(); c.arc(X(lp.x), Y(lp.y), 5, 0, Math.PI * 2); c.fill(); c.stroke();
}

/* ---------------- sicurezza ---------------- */
async function hashPin(p) {
  const str = 'tracker-salt:' + p;
  try { if (window.crypto && crypto.subtle) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)); return 'sha:' + [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); } } catch (e) {}
  let h = 5381; for (const ch of str) h = ((h << 5) + h + ch.charCodeAt(0)) | 0; return 'djb:' + (h >>> 0).toString(16);
}
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
async function bioRegister() {
  const cred = await navigator.credentials.create({publicKey: {
    challenge: rnd(32), rp: {name: 'Tracker Allenamenti'},
    user: {id: rnd(16), name: 'utente', displayName: 'Tracker Allenamenti'},
    pubKeyCredParams: [{type: 'public-key', alg: -7}, {type: 'public-key', alg: -257}],
    authenticatorSelection: {authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged'},
    timeout: 60000, attestation: 'none'
  }});
  return b64(cred.rawId);
}
async function bioVerify() {
  const a = await navigator.credentials.get({publicKey: {challenge: rnd(32), allowCredentials: [{type: 'public-key', id: unb64(S.settings.bio)}], userVerification: 'required', timeout: 60000}});
  return (new Uint8Array(a.response.authenticatorData)[32] & 0x04) !== 0;
}

function startSession(name, exs) {
  S.active = {start: Date.now(), name, notes: '', exercises: exs.map(sessEx)};
  preview = null; tab = 'train'; save(); render(); window.scrollTo(0, 0);
}
const getEx = b => S.active.exercises[+b.dataset.ex];
function placeholders(e) {
  const l = lastSummary(e.name);
  return {sets: l ? l.sets : (e.target ? e.target.sets : 0), reps: l ? l.reps : 0, kg: l ? l.kg : 0};
}
function buildSets(e, i, exs) {
  const ph = placeholders(e);
  const n = Math.max(0, Math.min(12, Math.round(num(e.sets) || (e.done ? ph.sets : 0))));
  const kg = e.kg !== '' ? num(e.kg) : (e.done ? ph.kg : 0);
  const baseReps = e.reps !== '' ? Math.round(num(e.reps)) : (e.done ? ph.reps : 0);
  const perSet = e.perSet || inSS(exs, i);
  const sets = [];
  for (let j = 0; j < n; j++) {
    const r = perSet && e.repsList[j] !== undefined && e.repsList[j] !== '' ? Math.round(num(e.repsList[j])) : baseReps;
    if (r > 0) sets.push({kg, reps: r});
  }
  if (e.drop && num(e.drop.reps) > 0 && sets.length) sets.push({kg: num(e.drop.kg), reps: Math.round(num(e.drop.reps)), drop: true});
  return sets;
}
function moveAfter(exs, from, anchor) {
  const [x] = exs.splice(from, 1);
  const a = from < anchor ? anchor - 1 : anchor;
  exs.splice(a + 1, 0, x);
  return a;
}
function addTo(tplId, name, muscle) {
  const t = S.templates.find(x => x.id === tplId); if (!t) return;
  if (t.exercises.some(e => e.name.toLowerCase() === name.toLowerCase())) { toast('Già presente in ' + t.name); return; }
  t.exercises.push(tplEx({name, muscle, sets: 3, reps: SEC_EX.test(name) ? '45' : '10', rest: '90"'}));
  save(); toast('Aggiunto a ' + t.name);
}

const actions = {
  gotrain() { tab = 'train'; render(); window.scrollTo(0, 0); },
  godb() { tab = 'db'; render(); window.scrollTo(0, 0); },
  gohistory() { tab = 'more'; more = 'history'; render(); window.scrollTo(0, 0); },
  preview(b) { preview = b.dataset.t; tab = 'train'; render(); window.scrollTo(0, 0); },
  back() { preview = null; render(); },
  start(b) { const t = S.templates.find(x => x.id === b.dataset.t); if (t) startSession(t.name, t.exercises); },
  startfree() { startSession('Allenamento libero', []); },
  menu(b) { const e = getEx(b); e.open = !e.open; save(); render(); },
  perset(b) { const e = getEx(b); e.perSet = !e.perSet; save(); render(); },
  drop(b) { const e = getEx(b); e.drop = e.drop ? null : {kg: '', reps: ''}; save(); render(); },
  done(b) {
    const exs = S.active.exercises, i = +b.dataset.ex, e = exs[i];
    if (e.done) { e.done = false; save(); render(); return; }
    e.done = true;
    if (!buildSets(e, i, exs).length) { e.done = false; toast('Inserisci serie e ripetizioni'); return; }
    const ph = placeholders(e);
    if (e.sets === '' && ph.sets) e.sets = String(ph.sets);
    if (e.reps === '' && ph.reps && !(e.perSet || inSS(exs, i))) e.reps = String(ph.reps);
    if (e.kg === '' && ph.kg) e.kg = fmt(ph.kg);
    e.open = false; save(); render();
  },
  delex(b) {
    const exs = S.active.exercises, i = +b.dataset.ex;
    if (!confirm('Rimuovere "' + exs[i].name + '" da questo allenamento?')) return;
    if (i > 0 && exs[i - 1].ss && !exs[i].ss) exs[i - 1].ss = false;
    exs.splice(i, 1); save(); render();
  },
  addex() { const n = document.getElementById('newex').value.trim(); if (!n) return; S.active.exercises.push(sessEx(tplEx({name: n, muscle: muscleOf(n)}))); save(); render(); },
  cancel() { if (confirm("Annullare l'allenamento? I dati inseriti andranno persi.")) { S.active = null; save(); render(); } },
  finish() {
    const exs = S.active.exercises;
    const ex = exs.map((e, i) => ({name: e.name, muscle: e.muscle, ss: inSS(exs, i) && !!e.ss, ...(e.unit ? {unit: e.unit} : {}), sets: buildSets(e, i, exs)})).filter(e => e.sets.length);
    if (!ex.length) { if (confirm('Nessun esercizio compilato. Chiudere senza salvare?')) { S.active = null; save(); render(); } return; }
    ex[ex.length - 1].ss = false;
    const prs = ex.filter(e => { const prev = bestEver(e.name), now = best(e.sets); return prev > 0 && now > prev + 0.01; }).map(e => e.name);
    S.sessions.push({id: uid(), date: S.active.start, end: Date.now(), name: S.active.name, exercises: ex, notes: S.active.notes || ''});
    S.active = null; save(); tab = 'home'; render(); window.scrollTo(0, 0);
    toast(prs.length ? 'Nuovo record: ' + prs.join(', ') : 'Allenamento salvato');
  },
  delsession(b) { if (confirm('Eliminare questo allenamento dallo storico?')) { S.sessions = S.sessions.filter(s => s.id !== b.dataset.id); save(); render(); } },
  metric(b) { progMetric = b.dataset.m; render(); },
  more(b) { more = b.dataset.k; render(); },
  dbm(b) { dbM = b.dataset.m; dbOpen = null; document.querySelectorAll('.chips .chip').forEach(c => c.classList.toggle('on', c.dataset.m === dbM)); renderDbList(); },
  dbopen(b) { dbOpen = dbOpen === b.dataset.n ? null : b.dataset.n; renderDbList(); },
  dbaddtpl(b) { addTo(b.dataset.t, b.dataset.n, b.dataset.m); renderDbList(); },
  dbaddact(b) { if (!S.active) return; S.active.exercises.push(sessEx(tplEx({name: b.dataset.n, muscle: b.dataset.m}))); save(); toast('Aggiunto all\'allenamento'); renderDbList(); },
  cxadd() {
    const n = document.getElementById('cxName').value.trim(), m = document.getElementById('cxMus').value;
    if (!n) { toast('Scrivi il nome'); return; }
    if (allExercises().some(x => x.name.toLowerCase() === n.toLowerCase())) { toast('Esiste già'); return; }
    S.customEx.push({name: n, muscle: m}); save(); dbM = m; dbQ = ''; dbOpen = n; render(); toast('Esercizio creato');
  },
  cxdel(b) { if (confirm('Eliminare "' + b.dataset.n + '" dal database? Schede e storico non vengono toccati.')) { S.customEx = S.customEx.filter(x => x.name !== b.dataset.n); dbOpen = null; save(); renderDbList(); } },
  ctype(b) { cardioType = b.dataset.k; render(); },
  addcardio() {
    const min = num(document.getElementById('cmin').value), kmh = num(document.getElementById('ckmh').value), d = document.getElementById('cdate').value;
    if (!(min > 0) || !(kmh > 0) || kmh > 40) { toast('Inserisci durata e velocità valide'); return; }
    const date = d ? dayTs(d) : Date.now();
    S.cardio.push({id: uid(), date: isoDay(date) === isoDay(Date.now()) ? Date.now() : date, type: cardioType, min: Math.round(min), kmh, km: Math.round(kmh * min / 60 * 100) / 100});
    save(); render(); toast('Cardio salvato');
  },
  delcardio(b) { if (confirm('Eliminare questa sessione di cardio?')) { S.cardio = S.cardio.filter(c => c.id !== b.dataset.id); save(); render(); } },
  savegoals() {
    const v = id => document.getElementById(id).value.trim();
    S.goals.weight = v('gW') ? num(v('gW')) : null;
    S.goals.bf = v('gB') ? num(v('gB')) : null;
    S.goals.date = v('gD') || null;
    S.goals.sessionsWeek = Math.max(1, Math.round(num(v('gS'))) || 4);
    S.goals.cardioMin = Math.max(0, Math.round(num(v('gC'))));
    save(); render(); toast('Obiettivi salvati');
  },
  addmeas(b) {
    const k = b.dataset.k, v = num(document.getElementById(k + 'In').value);
    if (k === 'weight') { if (v < 30 || v > 300) { toast('Valore non valido'); return; } S.weights.push({id: uid(), date: Date.now(), kg: v}); }
    else { if (v < 2 || v > 60) { toast('Valore non valido'); return; } S.bf.push({id: uid(), date: Date.now(), pct: v}); }
    save(); render();
  },
  delmeas(b) { const k = b.dataset.k === 'weight' ? 'weights' : 'bf'; S[k] = S[k].filter(x => x.id !== b.dataset.id); save(); render(); },
  tpldel(b) { const t = S.templates[+b.dataset.t]; if (confirm('Eliminare la scheda "' + t.name + '"? Lo storico non viene toccato.')) { S.templates.splice(+b.dataset.t, 1); save(); render(); } },
  tplup(b) { const ex = S.templates[+b.dataset.t].exercises, j = +b.dataset.j; if (j > 0) { [ex[j - 1], ex[j]] = [ex[j], ex[j - 1]]; save(); render(); reopen(+b.dataset.t); } },
  tplrm(b) { const ex = S.templates[+b.dataset.t].exercises; ex.splice(+b.dataset.j, 1); if (ex.length) ex[ex.length - 1].ss = false; save(); render(); reopen(+b.dataset.t); },
  tplss(b) { const e = S.templates[+b.dataset.t].exercises[+b.dataset.j]; e.ss = !e.ss; save(); render(); reopen(+b.dataset.t); },
  tpladd(b) { const n = document.getElementById('tplnew-' + b.dataset.t).value.trim(); if (!n) return; S.templates[+b.dataset.t].exercises.push(tplEx({name: n, muscle: muscleOf(n)})); save(); render(); reopen(+b.dataset.t); },
  tplnew() { S.templates.push({id: uid(), name: 'Nuova scheda', exercises: []}); save(); render(); reopen(S.templates.length - 1); },
  tplreset() { if (confirm('Ripristinare le 4 schede predefinite (Upper A/B, Lower A/B)? Le schede attuali verranno sostituite; lo storico resta.')) { S.templates = defaultTemplates(); save(); render(); toast('Schede ripristinate'); } },
  async pinset() {
    const p = document.getElementById('pinNew').value.trim();
    if (!/^\d{4,8}$/.test(p)) { toast('Il PIN deve avere da 4 a 8 cifre'); return; }
    if (prompt('Ripeti il PIN per conferma') !== p) { toast('I PIN non coincidono'); return; }
    S.settings.pin = await hashPin(p); save(); render(); toast('PIN impostato');
  },
  pinoff() {
    if (!confirm(S.settings.bio ? 'Rimuovendo il PIN si disattiva anche lo sblocco biometrico. Continuare?' : 'Rimuovere il PIN?')) return;
    S.settings.pin = null; S.settings.bio = null; save(); render();
  },
  async bioon() {
    if (!S.settings.pin) { toast('Imposta prima un PIN di riserva'); return; }
    try { S.settings.bio = await bioRegister(); save(); render(); toast('Sblocco biometrico attivo'); }
    catch (e) { toast('Attivazione annullata o non supportata'); }
  },
  biooff() { S.settings.bio = null; save(); render(); },
  async biounlock() {
    try { if (await bioVerify()) unlocked(); else toast('Verifica non riuscita'); }
    catch (e) { toast('Sblocco annullato: riprova o usa il PIN'); }
  },
  async unlock() {
    const i = document.getElementById('pinIn');
    if (await hashPin(i.value.trim()) === S.settings.pin) unlocked();
    else { i.value = ''; toast('PIN errato'); }
  },
  export() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(backupBlob()); a.download = backupName();
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
  async share() {
    const f = new File([backupBlob()], backupName(), {type: 'application/json'});
    try { if (navigator.canShare && navigator.canShare({files: [f]})) await navigator.share({files: [f], title: backupName()}); else actions.export(); } catch (e) {}
  },
  import() { document.getElementById('file').click(); },
  async persist() {
    try { const ok = navigator.storage && navigator.storage.persist && await navigator.storage.persist(); toast(ok ? 'Dati protetti' : 'Il browser non lo consente: fai backup regolari'); } catch (e) { toast('Non supportato su questo browser'); }
  },
  wipe() {
    if (!confirm('Cancellare TUTTI i dati? Operazione irreversibile.')) return;
    if (prompt('Scrivi CANCELLA per confermare') !== 'CANCELLA') return;
    S = normalize(null); save(); tab = 'home'; render(); toast('Dati cancellati');
  }
};
function reopen(i) { const d = main.querySelectorAll('details.card')[i]; if (d) d.open = true; }
function backupBlob() { return new Blob([JSON.stringify(S, null, 2)], {type: 'application/json'}); }
function backupName() { return 'tracker-backup-' + isoDay(Date.now()) + '.json'; }

/* ---------------- eventi ---------------- */
document.addEventListener('click', e => {
  const nb = e.target.closest('nav button');
  if (nb) { tab = nb.dataset.tab; if (tab !== 'train') preview = null; render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest('[data-a]');
  if (b && !b.disabled && actions[b.dataset.a]) actions[b.dataset.a](b);
});
main.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f && S.active) { getEx(t)[t.dataset.f] = t.value; save(); }
  else if (t.dataset.rl != null && S.active) { getEx(t).repsList[+t.dataset.rl] = t.value; save(); }
  else if (t.dataset.dp && S.active) { getEx(t).drop[t.dataset.dp] = t.value; save(); }
  else if (t.id === 'notes' && S.active) { S.active.notes = t.value; save(); }
  else if (t.id === 'dbq') { dbQ = t.value; dbOpen = null; renderDbList(); }
  else if (t.id === 'cmin' || t.id === 'ckmh') {
    const min = num(document.getElementById('cmin').value), kmh = num(document.getElementById('ckmh').value), r = document.getElementById('cres');
    r.innerHTML = kmh > 0 ? `Passo <b>${pace(kmh)}</b> min/km${min > 0 ? ` · Distanza <b>${fmt(kmh * min / 60)}</b> km` : ''}` : 'Inserisci durata e velocità: passo e distanza si calcolano da soli.';
  }
});
main.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.f === 'sets' && S.active) { const ex = getEx(t); if (ex.perSet || inSS(S.active.exercises, +t.dataset.ex)) render(); }
  else if (t.dataset.ssel != null && S.active) {
    const exs = S.active.exercises, i = +t.dataset.ssel;
    if (t.value === '') { exs[i].ss = false; }
    else {
      const k = +t.value;
      if (k > 0 && exs[k - 1].ss) exs[k - 1].ss = false;
      exs[k].ss = false;
      const a = moveAfter(exs, k, i);
      exs[a].ss = true;
    }
    save(); render();
  }
  else if (t.id === 'progEx') { progEx = t.value; render(); }
  else if (t.dataset.tname != null) { S.templates[+t.dataset.tname].name = t.value.trim() || 'Scheda'; save(); }
  else if (t.dataset.tmus != null) { S.templates[+t.dataset.tmus].exercises[+t.dataset.j].muscle = t.value; save(); }
  else if (t.dataset.tf) {
    const x = S.templates[+t.dataset.t].exercises[+t.dataset.j];
    if (t.dataset.tf === 'sets') { x.sets = Math.max(1, Math.round(num(t.value)) || x.sets); t.value = x.sets; } else x[t.dataset.tf] = t.value.trim();
    save();
  }
  else if (t.id === 'file' && t.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.sessions)) throw new Error('formato');
        if (!confirm('Importare il backup (' + d.sessions.length + ' allenamenti)? I dati attuali verranno sostituiti.')) return;
        S = normalize(d); save(); render(); toast('Backup importato');
      } catch (err) { toast('File non valido'); }
    };
    r.readAsText(t.files[0]);
  }
});
main.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const id = e.target.id || '';
  if (id === 'newex') actions.addex();
  else if (id === 'weightIn' || id === 'bfIn') actions.addmeas({dataset: {k: id.replace('In', '')}});
  else if (id.startsWith('tplnew-')) actions.tpladd({dataset: {t: id.slice(7)}});
  else if (id === 'cxName') actions.cxadd();
});
document.getElementById('pinIn').addEventListener('keydown', e => { if (e.key === 'Enter') actions.unlock(); });
setInterval(() => { const el = document.getElementById('elapsed'); if (el && S.active) el.textContent = dur(Date.now() - S.active.start); }, 15000);

/* ---------------- avvio ---------------- */
load(); save();
if (S.active) tab = 'train';
if (S.settings.pin || S.settings.bio) { showLock(); if (S.settings.bio) bioVerify().then(ok => { if (ok) unlocked(); }).catch(() => {}); }
else render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
