<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Tracker Allenamenti</title>
<style>
:root{--bg:#f4f5f7;--card:#ffffff;--text:#14171c;--muted:#6b7280;--line:#e3e6ea;--accent:#e4572e;--accent-ink:#ffffff;--ok:#2e9e5b;--warn:#d4900f;--input:#eef0f3;--danger:#c0392b;--ss:#4c7cf0}
@media (prefers-color-scheme: dark){:root{--bg:#0f1115;--card:#181b21;--text:#eef0f3;--muted:#9097a3;--line:#2a2f37;--input:#23272f;--ok:#3cbf72;--warn:#e6a92b;--danger:#e5675a;--ss:#6d95ff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 14px) 16px 8px;max-width:720px;margin:0 auto}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 8px}
h3{font-size:15px;margin:0 0 6px}
main{padding:0 16px calc(110px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:9px 0 7px;font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--input);border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.on{background:var(--ss);border-color:var(--ss);color:#fff}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn.sm{padding:6px 10px;font-size:13px}
.big{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--card);margin:10px 0}
.big b{font-size:18px}
.big .go{color:var(--muted);font-size:22px}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--input);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.set{display:grid;grid-template-columns:26px 1fr 12px 1fr 44px 34px;gap:6px;align-items:center;margin:6px 0}
.set .n{color:var(--muted);font-size:13px;text-align:center}
.set.drop .n{color:var(--accent);font-weight:800}
.set.drop input{border-style:dashed}
.set input{text-align:center;padding:9px 4px;height:42px}
.set .x{color:var(--muted);text-align:center}
.chk{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--input);font-weight:800;color:var(--muted)}
.set.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.set.done input{border-color:var(--ok)}
.del{height:34px;border:0;background:none;color:var(--muted);font-size:20px}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex-head b{font-size:16px}
.hint{font-size:12.5px;color:var(--muted);margin-top:2px}
.ss{border-left:4px solid var(--ss);padding-left:10px;margin:14px 0}
.ss .card{margin:8px 0}
.sslabel{color:var(--ss);font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--input);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
details.card summary{list-style:none;cursor:pointer}
details.card summary::-webkit-details-marker{display:none}
.exline{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.exline:first-child{border-top:0}
canvas{width:100%;height:200px;display:block}
.list-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.list-item:first-child{border-top:0}
.ico{border:0;background:var(--input);border-radius:8px;width:32px;height:32px;font-size:14px;color:var(--muted);flex:none}
.ico.on{background:var(--ss);color:#fff}
.pill{display:inline-block;background:var(--input);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--muted)}
.seg{display:flex;background:var(--input);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.bar{height:8px;background:var(--input);border-radius:99px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.score{display:flex;align-items:center;gap:16px}
.score .num{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;border:6px solid var(--accent);flex:none}
.score .num b{font-size:26px;line-height:1}
.score .num span{font-size:11px;color:var(--muted)}
.part{margin-top:10px}
.part .row{font-size:14px}
ul.clean{list-style:none;padding:0;margin:0}
ul.clean li{padding:7px 0;border-top:1px solid var(--line);font-size:14.5px}
ul.clean li:first-child{border-top:0}
.good{color:var(--ok)}.bad{color:var(--warn)}
.result{background:var(--input);border-radius:10px;padding:12px;margin-top:10px}
.result b{font-size:20px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
#lock[hidden]{display:none}
#lock .card{width:100%;max-width:340px;text-align:center}
</style>
</head>
<body>
<header><h1 id="title">Home</h1></header>
<main id="main"></main>
<div id="toast"></div>

<div id="lock" hidden>
  <div class="card">
    <h2>🔒 Tracker bloccato</h2>
    <div id="bioBox"><p></p><button class="btn primary block" data-a="biounlock">Sblocca con impronta / volto</button></div>
    <div id="pinBox"><p class="muted small" id="pinLbl">Inserisci il PIN</p>
      <input id="pinIn" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN"><p></p>
      <button class="btn block" data-a="unlock">Sblocca con PIN</button></div>
  </div>
</div>

<nav>
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>Home</button>
  <button data-tab="train"><svg viewBox="0 0 24 24"><path d="M3 10v4M6.5 7v10M17.5 7v10M21 10v4M6.5 12h11"/></svg>Allena</button>
  <button data-tab="cardio"><svg viewBox="0 0 24 24"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>Cardio</button>
  <button data-tab="body"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".8"/></svg>Obiettivi</button>
  <button data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>Altro</button>
</nav>

<script>
'use strict';
const KEY = 'tracker_allenamenti_v1';
const MUSCLES = ['Petto', 'Dorso', 'Spalle', 'Bicipiti', 'Tricipiti', 'Quadricipiti', 'Femorali', 'Glutei', 'Polpacci', 'Core', 'Altro'];
const MAIN_GROUPS = ['Petto', 'Dorso', 'Spalle', 'Bicipiti', 'Tricipiti', 'Quadricipiti', 'Femorali', 'Glutei'];
const DAY = 86400000;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const fmt = v => { const r = Math.round(v * 10) / 10; return Number.isInteger(r) ? String(r) : r.toFixed(1).replace('.', ','); };
const e1rm = s => s.kg > 0 && s.reps > 0 ? s.kg * (1 + s.reps / 30) : 0;
const best = sets => sets.reduce((a, s) => Math.max(a, e1rm(s)), 0);
const dLong = ts => new Date(ts).toLocaleDateString('it-IT', {weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'});
const dShort = ts => new Date(ts).toLocaleDateString('it-IT', {day: 'numeric', month: 'short'});
const dur = ms => { const m = Math.max(0, Math.round(ms / 60000)); return m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m + ' min'; };
const pace = kmh => { if (!(kmh > 0)) return '–'; const s = Math.round(3600 / kmh); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const isoDay = ts => { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const dayTs = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d, 12).getTime(); };
function weekStart(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.getTime(); }

function guessMuscle(n) {
  const s = n.toLowerCase();
  const R = [
    [/leg ext|squat|affond|pressa|quadric|hack|step/, 'Quadricipiti'],
    [/leg curl|femoral|rumeno|nordic/, 'Femorali'],
    [/hip thrust|glute|abductor|abduct|kickback|ponte/, 'Glutei'],
    [/calf|polpacc/, 'Polpacci'],
    [/push ?down|french|tricip|dip|skull|estensioni/, 'Tricipiti'],
    [/curl|bicip/, 'Bicipiti'],
    [/shoulder|alzate|military|lento|face pull|deltoid|spalle|arnold/, 'Spalle'],
    [/chest|panca|croci|pec|petto|push ?up|piegament/, 'Petto'],
    [/lat|pulley|rematore|row|trazion|pulldown|dorso|pullover/, 'Dorso'],
    [/crunch|plank|addom|core|addome/, 'Core']
  ];
  for (const [re, m] of R) if (re.test(s)) return m;
  return 'Altro';
}
const exObj = x => typeof x === 'string' ? {name: x, muscle: guessMuscle(x), ss: false} : {name: x.name, muscle: x.muscle || guessMuscle(x.name), ss: !!x.ss};

function defaults() {
  return {
    version: 2,
    templates: [
      {id: uid(), name: 'Push', exercises: ['Chest press', 'Panca inclinata manubri', 'Shoulder press macchina', 'Alzate laterali', 'Push down al cavo', 'French press manubrio'].map(exObj)},
      {id: uid(), name: 'Lower', exercises: ['Leg extension', 'Leg curl sdraiato', 'Leg curl seduto', 'Hip thrust macchina', 'Abductor machine', 'Calf seduto'].map(exObj)},
      {id: uid(), name: 'Pull', exercises: ['Lat machine', 'Pulley basso', 'Rematore manubrio con appoggio', 'Face pull', 'Curl manubri', 'Curl a martello'].map(exObj)}
    ],
    sessions: [], cardio: [], weights: [], bf: [],
    goals: {weight: null, bf: null, date: null, sessionsWeek: 4, cardioMin: 90},
    settings: {pin: null, bio: null},
    active: null
  };
}

let S;
function normalize(d) {
  const base = defaults();
  d = (d && typeof d === 'object') ? d : base;
  d.templates = (Array.isArray(d.templates) ? d.templates : base.templates).map(t => ({id: t.id || uid(), name: t.name || 'Scheda', exercises: (t.exercises || []).map(exObj)}));
  d.sessions = (Array.isArray(d.sessions) ? d.sessions : []).map(s => ({...s, exercises: (s.exercises || []).map(e => ({...exObj(e), sets: (e.sets || []).map(x => ({kg: num(x.kg), reps: Math.round(num(x.reps)), ...(x.drop ? {drop: true} : {})}))}))}));
  d.cardio = Array.isArray(d.cardio) ? d.cardio : [];
  d.weights = Array.isArray(d.weights) ? d.weights : [];
  d.bf = Array.isArray(d.bf) ? d.bf : [];
  d.goals = Object.assign({}, base.goals, d.goals || {});
  d.settings = {pin: (d.settings || {}).pin || null, bio: (d.settings || {}).bio || null};
  if (d.active) d.active.exercises = (d.active.exercises || []).map(e => ({...exObj(e), sets: e.sets || []}));
  d.version = 2;
  return d;
}
function load() { try { const r = localStorage.getItem(KEY); S = normalize(r ? JSON.parse(r) : null); } catch (e) { S = normalize(null); } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('⚠️ Impossibile salvare i dati'); } }

let tab = 'home', more = 'progress', preview = null, cardioType = 'corsa', progEx = null, progMetric = 'e1';

/* ---------------- calcoli ---------------- */
function lastFor(name) {
  for (let i = S.sessions.length - 1; i >= 0; i--) {
    const ex = S.sessions[i].exercises.find(e => e.name.toLowerCase() === name.toLowerCase());
    if (ex) return {date: S.sessions[i].date, sets: ex.sets};
  }
  return null;
}
function bestEver(name, before = Infinity) {
  let b = 0;
  S.sessions.forEach(s => { if (s.date < before) s.exercises.forEach(e => { if (e.name.toLowerCase() === name.toLowerCase()) b = Math.max(b, best(e.sets)); }); });
  return b;
}
function knownNames() {
  const set = new Set();
  S.templates.forEach(t => t.exercises.forEach(e => set.add(e.name)));
  S.sessions.forEach(s => s.exercises.forEach(e => set.add(e.name)));
  return [...set].sort((a, b) => a.localeCompare(b, 'it'));
}
function muscleOf(name) {
  for (const t of S.templates) { const e = t.exercises.find(x => x.name.toLowerCase() === name.toLowerCase()); if (e) return e.muscle; }
  const l = [...S.sessions].reverse().flatMap(s => s.exercises).find(x => x.name.toLowerCase() === name.toLowerCase());
  return l ? l.muscle : guessMuscle(name);
}
const emptySet = () => ({kg: '', reps: '', pkg: null, preps: null, done: false});
function prefill(name) {
  const l = lastFor(name);
  if (l && l.sets.length) return l.sets.map(s => ({kg: '', reps: '', pkg: s.kg, preps: s.reps, done: false, ...(s.drop ? {drop: true} : {})}));
  return [emptySet(), emptySet(), emptySet()];
}
const setsText = sets => sets.map(s => (s.drop ? '↳' : '') + (s.kg ? fmt(s.kg) : 'c.l.') + '×' + s.reps).join(' · ');
function ssGroups(exs) {
  const g = []; let open = false;
  exs.forEach((e, i) => { if (open) g[g.length - 1].push(i); else g.push([i]); open = !!e.ss && i < exs.length - 1; });
  return g;
}
function latest(arr) { return arr.length ? [...arr].sort((a, b) => a.date - b.date)[arr.length - 1] : null; }
function trendPerDay(arr, days = 28) {
  const pts = arr.filter(x => x.date >= Date.now() - days * DAY).sort((a, b) => a.date - b.date);
  if (pts.length < 2 || pts[pts.length - 1].date - pts[0].date < 5 * DAY) return null;
  const n = pts.length, mx = pts.reduce((a, p) => a + p.date, 0) / n, my = pts.reduce((a, p) => a + p.v, 0) / n;
  let sxy = 0, sxx = 0; pts.forEach(p => { sxy += (p.date - mx) * (p.v - my); sxx += (p.date - mx) ** 2; });
  return sxx ? sxy / sxx * DAY : null;
}

function weekEval(ws) {
  const we = ws + 7 * DAY, g = S.goals;
  const ss = S.sessions.filter(s => s.date >= ws && s.date < we);
  const cm = S.cardio.filter(c => c.date >= ws && c.date < we).reduce((a, c) => a + c.min, 0);
  const freq = Math.min(1, ss.length / (g.sessionsWeek || 4));
  let comp = 0, imp = 0;
  ss.forEach(s => s.exercises.forEach(e => {
    const now = best(e.sets); if (!now) return;
    let prev = 0;
    S.sessions.filter(p => p.date < ws && p.date >= ws - 35 * DAY).forEach(p => p.exercises.forEach(x => { if (x.name === e.name) prev = Math.max(prev, best(x.sets)); }));
    if (prev > 0) { comp++; if (now >= prev * 0.99) imp++; }
  }));
  const prog = comp ? imp / comp : (ss.length ? 0.5 : 0);
  const mg = new Set(); ss.forEach(s => s.exercises.forEach(e => mg.add(e.muscle)));
  const covered = MAIN_GROUPS.filter(x => mg.has(x)).length;
  const car = Math.min(1, cm / (g.cardioMin || 90));
  const parts = [
    {name: 'Frequenza', v: freq, max: 40, txt: `${ss.length} su ${g.sessionsWeek} allenamenti`, tip: 'allenati più spesso'},
    {name: 'Progressione', v: prog, max: 30, txt: comp ? `${imp} su ${comp} esercizi stabili o in crescita` : 'nessun confronto con le settimane prima', tip: 'cerca di aumentare carichi o ripetizioni'},
    {name: 'Equilibrio', v: covered / MAIN_GROUPS.length, max: 15, txt: `${covered} su 8 gruppi muscolari allenati`, tip: 'allena anche i gruppi muscolari trascurati'},
    {name: 'Cardio', v: car, max: 15, txt: `${cm} su ${g.cardioMin} min`, tip: 'aggiungi minuti di cardio'}
  ];
  const score = Math.round(parts.reduce((a, p) => a + p.v * p.max, 0));
  const label = score >= 85 ? 'Ottima' : score >= 70 ? 'Buona' : score >= 50 ? 'Sufficiente' : 'Da migliorare';
  const weak = [...parts].sort((a, b) => a.v - b.v)[0];
  return {score, label, parts, sessions: ss.length, cardioMin: cm, tip: weak.v < 0.8 ? weak.tip : null};
}

function strengthsWeak() {
  const now = Date.now(), recent = S.sessions.filter(s => s.date >= now - 28 * DAY);
  if (recent.length < 3) return {ready: false, forti: [], deboli: []};
  const st = {}; MAIN_GROUPS.forEach(g => st[g] = {sets: 0, tr: []});
  recent.forEach(s => s.exercises.forEach(e => { if (st[e.muscle]) st[e.muscle].sets += e.sets.filter(x => !x.drop).length; }));
  const byEx = {};
  S.sessions.filter(s => s.date >= now - 42 * DAY).forEach(s => s.exercises.forEach(e => { const b = best(e.sets); if (b) (byEx[e.name] = byEx[e.name] || {m: e.muscle, v: []}).v.push(b); }));
  const exTr = [];
  Object.entries(byEx).forEach(([n, x]) => { if (x.v.length >= 2) { const t = (Math.max(...x.v.slice(-2)) - x.v[0]) / x.v[0]; exTr.push({n, t}); if (st[x.m]) st[x.m].tr.push(t); } });
  const forti = [], deboli = [];
  MAIN_GROUPS.forEach(g => {
    const wk = st[g].sets / 4, tr = st[g].tr.length ? st[g].tr.reduce((a, b) => a + b, 0) / st[g].tr.length : null;
    if (tr !== null && tr > 0.03) forti.push({s: tr, t: `<b>${g}</b>: carichi in crescita (+${fmt(tr * 100)}%)`});
    else if (wk >= 10) forti.push({s: wk / 100, t: `<b>${g}</b>: volume solido (~${fmt(wk)} serie/sett.)`});
    if (wk < 4) deboli.push({s: -wk, t: `<b>${g}</b>: poco allenato (~${fmt(wk)} serie/sett.)`});
    else if (tr !== null && tr <= 0) deboli.push({s: -10 + tr, t: `<b>${g}</b>: carichi fermi nelle ultime settimane`});
  });
  exTr.sort((a, b) => b.t - a.t);
  if (exTr[0] && exTr[0].t > 0.05) forti.unshift({s: 9, t: `Miglior progresso: <b>${esc(exTr[0].n)}</b> (+${fmt(exTr[0].t * 100)}%)`});
  const w = latest(S.weights), tw = trendPerDay(S.weights.map(x => ({date: x.date, v: x.kg})));
  if (S.goals.weight && w && tw !== null) {
    const dir = Math.sign(S.goals.weight - w.kg);
    if (dir !== 0 && Math.sign(tw) === dir) forti.push({s: 1, t: `<b>Peso</b>: va nella direzione dell'obiettivo (${tw > 0 ? '+' : ''}${fmt(tw * 7)} kg/sett.)`});
    else if (dir !== 0) deboli.push({s: 1, t: `<b>Peso</b>: non si sta muovendo verso l'obiettivo`});
  }
  forti.sort((a, b) => b.s - a.s); deboli.sort((a, b) => b.s - a.s);
  return {ready: true, forti: forti.slice(0, 4).map(x => x.t), deboli: deboli.slice(0, 4).map(x => x.t)};
}

function goalInfo(kind) {
  const isW = kind === 'weight', arr = (isW ? S.weights : S.bf).map(x => ({date: x.date, v: isW ? x.kg : x.pct}));
  const target = isW ? S.goals.weight : S.goals.bf;
  if (!arr.length) return {empty: true, target};
  const sorted = [...arr].sort((a, b) => a.date - b.date), cur = sorted[sorted.length - 1].v, start = sorted[0].v;
  const r = {cur, start, target, unit: isW ? 'kg' : '%'};
  if (target != null) {
    const tot = Math.abs(start - target);
    r.pct = tot ? Math.max(0, Math.min(1, 1 - Math.abs(cur - target) / tot)) : (cur === target ? 1 : 0);
    r.left = target - cur;
    if (S.goals.date) { const wks = (dayTs(S.goals.date) - Date.now()) / (7 * DAY); r.weeks = wks; if (wks > 0) r.need = r.left / wks; }
    const t = trendPerDay(arr);
    r.trend = t;
    if (t && Math.sign(t) === Math.sign(r.left) && Math.abs(r.left) > 0.05) r.eta = Date.now() + r.left / t * DAY;
  }
  return r;
}

      ${S.settings.bio ? `<button class="btn sm danger" data-a="biooff">Disattiva</button>` : `<button class="btn sm" data-a="bioon" ${bioOk ? '' : 'disabled'}>Attiva</button>`}</div>
      <p class="small muted" style="margin-bottom:0">${bioOk ? 'Usa il sensore del telefono. Serve un PIN come riserva, nel caso il sensore non funzioni.' : "Disponibile solo aprendo l'app dal suo indirizzo https (GitHub Pages)."} Il blocco impedisce ad altri di aprire l'app sul tuo telefono.</p>
    </div>
    <h2 style="margin-top:22px">Backup</h2>
    <div class="card">
      <p class="small muted" style="margin-top:0">I dati sono salvati solo su questo dispositivo. Esporta un backup ogni tanto: serve per non perderli e per spostarli tra telefono e PC.</p>
      <div class="row"><button class="btn" data-a="export">Scarica backup</button>${navigator.share ? '<button class="btn" data-a="share">Condividi (es. Drive)</button>' : ''}<button class="btn" data-a="import">Importa</button></div>
      <input id="file" type="file" accept="application/json,.json" hidden>
      <div class="row" style="margin-top:10px"><button class="btn sm" data-a="persist">Proteggi dati dalla pulizia automatica</button></div>
    </div>
    <div class="card row between"><span class="small muted">Tracker Allenamenti · v2.1</span><button class="btn sm danger" data-a="wipe">Cancella tutto</button></div>`;
  return h;
}

/* ---------------- grafici ---------------- */
function drawChart(cv, pts) {
  if (!cv) return;
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  const c = cv.getContext('2d'); c.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement), col = k => cs.getPropertyValue(k).trim();
  c.clearRect(0, 0, w, h); c.font = '12px system-ui,sans-serif';
  if (!pts.length) { c.fillStyle = col('--muted'); c.textAlign = 'center'; c.fillText('Nessun dato ancora', w / 2, h / 2); return; }
  const pl = 42, pr = 12, pt = 12, pb = 24, xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= DAY; x1 += DAY; }
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = (y1 - y0) * 0.15 || Math.max(1, y1 * 0.05); y0 -= pad; y1 += pad;
  const X = x => pl + (x - x0) / (x1 - x0) * (w - pl - pr), Y = y => pt + (1 - (y - y0) / (y1 - y0)) * (h - pt - pb);
  c.strokeStyle = col('--line'); c.fillStyle = col('--muted'); c.lineWidth = 1; c.textAlign = 'right'; c.textBaseline = 'middle';
  for (let i = 0; i <= 3; i++) { const v = y0 + (y1 - y0) * i / 3, yy = Y(v); c.beginPath(); c.moveTo(pl, yy); c.lineTo(w - pr, yy); c.stroke(); c.fillText(fmt(v), pl - 6, yy); }
  c.textBaseline = 'alphabetic'; c.textAlign = 'left'; c.fillText(dShort(Math.min(...xs)), pl, h - 6);
  if (pts.length > 1) { c.textAlign = 'right'; c.fillText(dShort(Math.max(...xs)), w - pr, h - 6); }
  c.strokeStyle = col('--accent'); c.lineWidth = 2.5; c.lineJoin = 'round'; c.beginPath();
  pts.forEach((p, i) => i ? c.lineTo(X(p.x), Y(p.y)) : c.moveTo(X(p.x), Y(p.y))); c.stroke();
  c.fillStyle = col('--accent'); pts.forEach(p => { c.beginPath(); c.arc(X(p.x), Y(p.y), 3.5, 0, Math.PI * 2); c.fill(); });
}

/* ---------------- render ---------------- */
const main = document.getElementById('main');
function render() {
  document.getElementById('title').textContent = (tab === 'train' && S.active) ? 'Allenamento in corso' : TITLES[tab];
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  main.innerHTML = views[tab]();
  drawCharts();
}
function drawCharts() {
  if (tab === 'more' && more === 'progress' && progEx) drawChart(document.getElementById('chart'), exPoints(progEx, progMetric));
  if (tab === 'cardio') drawChart(document.getElementById('cchart'), views.cardio.chart || []);
  if (tab === 'body') {
    drawChart(document.getElementById('weightchart'), S.weights.slice().sort((a, b) => a.date - b.date).map(x => ({x: x.date, y: x.kg})));
    drawChart(document.getElementById('bfchart'), S.bf.slice().sort((a, b) => a.date - b.date).map(x => ({x: x.date, y: x.pct})));
  }
}
// Solo i grafici vengono ridisegnati, e solo se cambia la LARGHEZZA:
// l'apertura della tastiera cambia l'altezza e non deve toccare i campi di testo.
let rz, lastW = window.innerWidth;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (window.innerWidth !== lastW) { lastW = window.innerWidth; drawCharts(); } }, 200); });

let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* ---------------- sicurezza ---------------- */
async function hashPin(p) {
  const str = 'tracker-salt:' + p;
  try { if (window.crypto && crypto.subtle) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)); return 'sha:' + [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); } } catch (e) {}
  let h = 5381; for (const ch of str) h = ((h << 5) + h + ch.charCodeAt(0)) | 0; return 'djb:' + (h >>> 0).toString(16);
}
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
async function bioRegister() {
  const cred = await navigator.credentials.create({publicKey: {
    challenge: rnd(32), rp: {name: 'Tracker Allenamenti'},
    user: {id: rnd(16), name: 'utente', displayName: 'Tracker Allenamenti'},
    pubKeyCredParams: [{type: 'public-key', alg: -7}, {type: 'public-key', alg: -257}],
    authenticatorSelection: {authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged'},
    timeout: 60000, attestation: 'none'
  }});
  return b64(cred.rawId);
}
async function bioVerify() {
  const a = await navigator.credentials.get({publicKey: {challenge: rnd(32), allowCredentials: [{type: 'public-key', id: unb64(S.settings.bio)}], userVerification: 'required', timeout: 60000}});
  const ad = new Uint8Array(a.response.authenticatorData);
  return (ad[32] & 0x04) !== 0; // flag "utente verificato"
}
function showLock() {
  const lock = document.getElementById('lock');
  lock.hidden = false;
  document.getElementById('bioBox').hidden = !S.settings.bio;
  document.getElementById('pinBox').hidden = !S.settings.pin;
  document.getElementById('pinLbl').textContent = S.settings.bio ? 'Oppure usa il PIN' : 'Inserisci il PIN';
}
function unlocked() { document.getElementById('lock').hidden = true; document.getElementById('pinIn').value = ''; render(); }

/* ---------------- azioni ---------------- */
function startSession(name, exs) {
  S.active = {start: Date.now(), name, notes: '', exercises: exs.map(e => ({name: e.name, muscle: e.muscle, ss: !!e.ss, sets: prefill(e.name)}))};
  preview = null; save(); render(); window.scrollTo(0, 0);
}
const getSet = b => S.active.exercises[+b.dataset.ex].sets[+b.dataset.set];
const lastVal = (s, f) => s[f] !== '' ? num(s[f]) : s['p' + f];

const actions = {
  gotrain() { tab = 'train'; render(); window.scrollTo(0, 0); },
  gohistory() { tab = 'more'; more = 'history'; render(); window.scrollTo(0, 0); },
  preview(b) { preview = b.dataset.t; render(); window.scrollTo(0, 0); },
  back() { preview = null; render(); },
  start(b) { const t = S.templates.find(x => x.id === b.dataset.t); if (t) startSession(t.name, t.exercises); },
  startfree() { startSession('Allenamento libero', []); },
  done(b) {
    const s = getSet(b);
    if (!s.done) {
      if (s.kg === '' && s.pkg != null) s.kg = fmt(s.pkg);
      if (s.reps === '' && s.preps != null) s.reps = String(s.preps);
      if (!num(s.reps)) { toast('Inserisci le ripetizioni'); return; }
      s.done = true;
    } else s.done = false;
    save(); render();
  },
  addset(b) {
    const e = S.active.exercises[+b.dataset.ex], l = [...e.sets].reverse().find(x => !x.drop);
    e.sets.push(l ? {kg: '', reps: '', pkg: lastVal(l, 'kg'), preps: lastVal(l, 'reps'), done: false} : emptySet());
    save(); render();
  },
  adddrop(b) {
    const e = S.active.exercises[+b.dataset.ex], l = e.sets[e.sets.length - 1];
    if (!l) { toast('Aggiungi prima una serie normale'); return; }
    const k = lastVal(l, 'kg');
    e.sets.push({kg: '', reps: '', pkg: k ? Math.max(0, Math.round(k * 0.8 / 2.5) * 2.5) : null, preps: null, done: false, drop: true});
    save(); render();
  },
  ss(b) { const e = S.active.exercises[+b.dataset.ex]; e.ss = !e.ss; save(); render(); },
  delset(b) { S.active.exercises[+b.dataset.ex].sets.splice(+b.dataset.set, 1); save(); render(); },
  delex(b) { const i = +b.dataset.ex, e = S.active.exercises[i]; if (confirm('Rimuovere "' + e.name + '" da questo allenamento?')) { S.active.exercises.splice(i, 1); if (i > 0 && i === S.active.exercises.length) S.active.exercises[i - 1].ss = false; save(); render(); } },
  addex() { const n = document.getElementById('newex').value.trim(); if (!n) return; S.active.exercises.push({name: n, muscle: muscleOf(n), ss: false, sets: prefill(n)}); save(); render(); },
  cancel() { if (confirm("Annullare l'allenamento? Le serie inserite andranno perse.")) { S.active = null; save(); render(); } },
  finish() {
    const a = S.active;
    const ex = a.exercises.map(e => ({name: e.name, muscle: e.muscle, ss: !!e.ss, sets: e.sets.map(s => ({kg: num(s.kg), reps: Math.round(num(s.reps)), ...(s.drop ? {drop: true} : {})})).filter(s => s.reps > 0)})).filter(e => e.sets.length);
    if (!ex.length) { if (confirm('Nessuna serie compilata. Chiudere senza salvare?')) { S.active = null; save(); render(); } return; }
    ex.forEach((e, i) => { if (i === ex.length - 1) e.ss = false; });
    const prs = ex.filter(e => { const prev = bestEver(e.name), now = best(e.sets); return prev > 0 && now > prev + 0.01; }).map(e => e.name);
    S.sessions.push({id: uid(), date: a.start, end: Date.now(), name: a.name, exercises: ex, notes: a.notes || ''});
    S.active = null; save(); tab = 'home'; render(); window.scrollTo(0, 0);
    toast(prs.length ? '🏆 Nuovo record: ' + prs.join(', ') : 'Allenamento salvato 💪');
  },
  delsession(b) { if (confirm('Eliminare questo allenamento dallo storico?')) { S.sessions = S.sessions.filter(s => s.id !== b.dataset.id); save(); render(); } },
  metric(b) { progMetric = b.dataset.m; render(); },
  more(b) { more = b.dataset.k; render(); },
  ctype(b) { cardioType = b.dataset.k; render(); },
  addcardio() {
    const min = num(document.getElementById('cmin').value), kmh = num(document.getElementById('ckmh').value), d = document.getElementById('cdate').value;
    if (!(min > 0) || !(kmh > 0) || kmh > 40) { toast('Inserisci durata e velocità valide'); return; }
    const date = d ? dayTs(d) : Date.now();
    S.cardio.push({id: uid(), date: isoDay(date) === isoDay(Date.now()) ? Date.now() : date, type: cardioType, min: Math.round(min), kmh, km: Math.round(kmh * min / 60 * 100) / 100});
    save(); render(); toast('Cardio salvato ✅');
  },
  delcardio(b) { if (confirm('Eliminare questa sessione di cardio?')) { S.cardio = S.cardio.filter(c => c.id !== b.dataset.id); save(); render(); } },
  savegoals() {
    const v = id => document.getElementById(id).value.trim();
    S.goals.weight = v('gW') ? num(v('gW')) : null;
    S.goals.bf = v('gB') ? num(v('gB')) : null;
    S.goals.date = v('gD') || null;
    S.goals.sessionsWeek = Math.max(1, Math.round(num(v('gS'))) || 4);
    S.goals.cardioMin = Math.max(0, Math.round(num(v('gC'))));
    save(); render(); toast('Obiettivi salvati 🎯');
  },
  addmeas(b) {
    const k = b.dataset.k, v = num(document.getElementById(k + 'In').value);
    if (k === 'weight') { if (v < 30 || v > 300) { toast('Valore non valido'); return; } S.weights.push({id: uid(), date: Date.now(), kg: v}); }
    else { if (v < 2 || v > 60) { toast('Valore non valido'); return; } S.bf.push({id: uid(), date: Date.now(), pct: v}); }
    save(); render();
  },
  delmeas(b) { const k = b.dataset.k === 'weight' ? 'weights' : 'bf'; S[k] = S[k].filter(x => x.id !== b.dataset.id); save(); render(); },
  tpldel(b) { const t = S.templates[+b.dataset.t]; if (confirm('Eliminare la scheda "' + t.name + '"? Lo storico non viene toccato.')) { S.templates.splice(+b.dataset.t, 1); save(); render(); } },
  tplup(b) { const ex = S.templates[+b.dataset.t].exercises, j = +b.dataset.j; if (j > 0) { [ex[j - 1], ex[j]] = [ex[j], ex[j - 1]]; save(); render(); } },
  tplrm(b) { const ex = S.templates[+b.dataset.t].exercises; ex.splice(+b.dataset.j, 1); if (ex.length) ex[ex.length - 1].ss = false; save(); render(); },
  tplss(b) { const e = S.templates[+b.dataset.t].exercises[+b.dataset.j]; e.ss = !e.ss; save(); render(); },
  tpladd(b) { const n = document.getElementById('tplnew-' + b.dataset.t).value.trim(); if (!n) return; S.templates[+b.dataset.t].exercises.push({name: n, muscle: muscleOf(n), ss: false}); save(); render(); },
  tplnew() { S.templates.push({id: uid(), name: 'Nuova scheda', exercises: []}); save(); render(); },
  async pinset() {
    const p = document.getElementById('pinNew').value.trim();
    if (!/^\d{4,8}$/.test(p)) { toast('Il PIN deve avere da 4 a 8 cifre'); return; }
    if (prompt('Ripeti il PIN per conferma') !== p) { toast('I PIN non coincidono'); return; }
    S.settings.pin = await hashPin(p); save(); render(); toast('PIN impostato 🔒');
  },
  pinoff() {
    if (!confirm(S.settings.bio ? 'Rimuovendo il PIN si disattiva anche lo sblocco con impronta. Continuare?' : 'Rimuovere il PIN?')) return;
    S.settings.pin = null; S.settings.bio = null; save(); render();
  },
  async bioon() {
    if (!S.settings.pin) { toast('Imposta prima un PIN di riserva'); return; }
    try { S.settings.bio = await bioRegister(); save(); render(); toast('Sblocco biometrico attivo 👆'); }
    catch (e) { toast('Attivazione annullata o non supportata'); }
  },
  biooff() { S.settings.bio = null; save(); render(); },
  async biounlock() {
    try { if (await bioVerify()) unlocked(); else toast('Verifica non riuscita'); }
    catch (e) { toast('Sblocco annullato: riprova o usa il PIN'); }
  },
  async unlock() {
    const i = document.getElementById('pinIn');
    if (await hashPin(i.value.trim()) === S.settings.pin) unlocked();
    else { i.value = ''; toast('PIN errato'); }
  },
  export() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(backupBlob()); a.download = backupName();
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
  async share() {
    const f = new File([backupBlob()], backupName(), {type: 'application/json'});
    try { if (navigator.canShare && navigator.canShare({files: [f]})) await navigator.share({files: [f], title: backupName()}); else actions.export(); } catch (e) {}
  },
  import() { document.getElementById('file').click(); },
  async persist() {
    try { const ok = navigator.storage && navigator.storage.persist && await navigator.storage.persist(); toast(ok ? 'Dati protetti ✅' : 'Il browser non lo consente: fai backup regolari'); } catch (e) { toast('Non supportato su questo browser'); }
  },
  wipe() {
    if (!confirm('Cancellare TUTTI i dati? Operazione irreversibile.')) return;
    if (prompt('Scrivi CANCELLA per confermare') !== 'CANCELLA') return;
    S = normalize(null); save(); tab = 'home'; render(); toast('Dati cancellati');
  }
};
function backupBlob() { const c = JSON.parse(JSON.stringify(S)); return new Blob([JSON.stringify(c, null, 2)], {type: 'application/json'}); }
function backupName() { return 'tracker-backup-' + isoDay(Date.now()) + '.json'; }

/* ---------------- eventi ---------------- */
document.addEventListener('click', e => {
  const nb = e.target.closest('nav button');
  if (nb) { tab = nb.dataset.tab; if (tab !== 'train') preview = null; render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest('[data-a]');
  if (b && !b.disabled && actions[b.dataset.a]) actions[b.dataset.a](b);
});
main.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f && S.active) { getSet(t)[t.dataset.f] = t.value; save(); }
  else if (t.id === 'notes' && S.active) { S.active.notes = t.value; save(); }
  else if (t.id === 'cmin' || t.id === 'ckmh') {
    const min = num(document.getElementById('cmin').value), kmh = num(document.getElementById('ckmh').value), r = document.getElementById('cres');
    r.innerHTML = kmh > 0 ? `Passo: <b>${pace(kmh)}</b> min/km${min > 0 ? ` · Distanza: <b>${fmt(kmh * min / 60)}</b> km` : ''}` : 'Inserisci durata e velocità per calcolare passo e distanza.';
  }
});
main.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'progEx') { progEx = t.value; render(); }
  else if (t.dataset.tname != null) { S.templates[+t.dataset.tname].name = t.value.trim() || 'Scheda'; save(); }
  else if (t.dataset.tmus != null) { S.templates[+t.dataset.tmus].exercises[+t.dataset.j].muscle = t.value; save(); }
  else if (t.id === 'file' && t.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.sessions)) throw new Error('formato');
        if (!confirm('Importare il backup (' + d.sessions.length + ' allenamenti)? I dati attuali verranno sostituiti.')) return;
        S = normalize(d); save(); render(); toast('Backup importato ✅');
      } catch (err) { toast('File non valido'); }
    };
    r.readAsText(t.files[0]);
  }
});
main.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const id = e.target.id || '';
  if (id === 'newex') actions.addex();
  else if (id === 'weightIn' || id === 'bfIn') actions.addmeas({dataset: {k: id.replace('In', '')}});
  else if (id.startsWith('tplnew-')) actions.tpladd({dataset: {t: id.slice(7)}});
});
document.getElementById('pinIn').addEventListener('keydown', e => { if (e.key === 'Enter') actions.unlock(); });
setInterval(() => { const el = document.getElementById('elapsed'); if (el && S.active) el.textContent = dur(Date.now() - S.active.start); }, 15000);

/* ---------------- avvio ---------------- */
load(); save();
if (S.active) tab = 'train';
if (S.settings.pin || S.settings.bio) { showLock(); if (S.settings.bio) bioVerify().then(ok => { if (ok) unlocked(); }).catch(() => {}); }
else render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
