<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Tracker Allenamenti</title>
<style>
:root{--bg:#f4f5f7;--card:#ffffff;--text:#14171c;--muted:#6b7280;--line:#e3e6ea;--accent:#e4572e;--accent-ink:#ffffff;--ok:#2e9e5b;--input:#eef0f3;--danger:#c0392b}
@media (prefers-color-scheme: dark){:root{--bg:#0f1115;--card:#181b21;--text:#eef0f3;--muted:#9097a3;--line:#2a2f37;--input:#23272f;--ok:#3cbf72;--danger:#e5675a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 14px) 16px 8px;max-width:720px;margin:0 auto}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 8px}
main{padding:0 16px calc(150px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:9px 0 7px;font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--input);border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn.sm{padding:6px 10px;font-size:13px}
.big{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--card);margin:10px 0}
.big b{font-size:18px}
.big .go{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--input);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.set{display:grid;grid-template-columns:22px 1fr 12px 1fr 44px 34px;gap:6px;align-items:center;margin:6px 0}
.set .n{color:var(--muted);font-size:13px;text-align:center}
.set input{text-align:center;padding:9px 4px;height:42px}
.set .x{color:var(--muted);text-align:center}
.chk{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--input);font-weight:800;color:var(--muted)}
.set.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.set.done input{border-color:var(--ok)}
.del{height:34px;border:0;background:none;color:var(--muted);font-size:20px}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex-head b{font-size:16px}
.hint{font-size:12.5px;color:var(--muted);margin-top:2px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--input);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
details.card summary{list-style:none;cursor:pointer}
details.card summary::-webkit-details-marker{display:none}
.exline{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.exline:first-child{border-top:0}
canvas{width:100%;height:210px;display:block}
.list-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.list-item:first-child{border-top:0}
.ico{border:0;background:var(--input);border-radius:8px;width:32px;height:32px;font-size:14px;color:var(--muted)}
#timer{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:9;background:var(--text);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;max-width:696px;margin:0 auto;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#timer[hidden]{display:none}
#timer b{font-size:24px;font-variant-numeric:tabular-nums;flex:1}
#timer button{border:0;border-radius:8px;padding:8px 10px;background:rgba(127,127,127,.25);color:inherit;font-weight:700}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
#lock[hidden]{display:none}
#lock .card{width:100%;max-width:340px;text-align:center}
.pill{display:inline-block;background:var(--input);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header><h1 id="title">Allena</h1></header>
<main id="main"></main>

<div id="timer" hidden><span class="small">Recupero</span><b>1:30</b><button data-a="t15">+15s</button><button data-a="tstop">Stop</button></div>
<div id="toast"></div>

<div id="lock" hidden>
  <div class="card">
    <h2>🔒 Tracker bloccato</h2>
    <p class="muted small">Inserisci il PIN</p>
    <input id="pinIn" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN">
    <p></p>
    <button class="btn primary block" data-a="unlock">Sblocca</button>
  </div>
</div>

<nav>
  <button data-tab="train" class="on"><svg viewBox="0 0 24 24"><path d="M3 10v4M6.5 7v10M17.5 7v10M21 10v4M6.5 12h11"/></svg>Allena</button>
  <button data-tab="history"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Storico</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M4 19h16M6 15l4-5 3 3 5-7"/></svg>Progressi</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="16" cy="7" r="2.5"/><circle cx="10" cy="17" r="2.5"/></svg>Impostazioni</button>
</nav>

<script>
'use strict';
const KEY = 'tracker_allenamenti_v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const fmt = v => { const r = Math.round(v * 10) / 10; return Number.isInteger(r) ? String(r) : r.toFixed(1).replace('.', ','); };
const e1rm = s => s.kg > 0 && s.reps > 0 ? s.kg * (1 + s.reps / 30) : 0;
const DAY = 86400000;
const dLong = ts => new Date(ts).toLocaleDateString('it-IT', {weekday:'short', day:'numeric', month:'short', year:'numeric'});
const dShort = ts => new Date(ts).toLocaleDateString('it-IT', {day:'numeric', month:'short'});
const mmss = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
const dur = ms => { const m = Math.max(0, Math.round(ms / 60000)); return m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m + ' min'; };

function defaults() {
  return {
    version: 1,
    templates: [
      {id: uid(), name: 'Push', exercises: ['Chest press', 'Panca inclinata manubri', 'Shoulder press macchina', 'Alzate laterali', 'Push down al cavo', 'French press manubrio']},
      {id: uid(), name: 'Lower', exercises: ['Leg extension', 'Leg curl sdraiato', 'Leg curl seduto', 'Hip thrust macchina', 'Abductor machine', 'Calf seduto']},
      {id: uid(), name: 'Pull', exercises: ['Lat machine', 'Pulley basso', 'Rematore manubrio con appoggio', 'Face pull', 'Curl manubri', 'Curl a martello']}
    ],
    sessions: [], weights: [], settings: {rest: 90, pin: null}, active: null
  };
}

let S;
function normalize(d) {
  const base = defaults();
  d = (d && typeof d === 'object') ? d : base;
  d.templates = Array.isArray(d.templates) ? d.templates : base.templates;
  d.sessions = Array.isArray(d.sessions) ? d.sessions : [];
  d.weights = Array.isArray(d.weights) ? d.weights : [];
  d.settings = Object.assign({rest: 90, pin: null}, d.settings || {});
  d.active = d.active || null;
  d.version = 1;
  return d;
}
function load() { try { const r = localStorage.getItem(KEY); S = normalize(r ? JSON.parse(r) : null); } catch (e) { S = normalize(null); } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('⚠️ Impossibile salvare i dati'); } }

let tab = 'train', progEx = null, progMetric = 'e1';

/* ---------- helpers dati ---------- */
function lastFor(name) {
  for (let i = S.sessions.length - 1; i >= 0; i--) {
    const ex = S.sessions[i].exercises.find(e => e.name.toLowerCase() === name.toLowerCase());
    if (ex) return {date: S.sessions[i].date, sets: ex.sets};
  }
  return null;
}
function bestE1(name) {
  let b = 0;
  S.sessions.forEach(s => s.exercises.forEach(e => { if (e.name.toLowerCase() === name.toLowerCase()) e.sets.forEach(x => b = Math.max(b, e1rm(x))); }));
  return b;
}
function knownNames() {
  const set = new Set();
  S.templates.forEach(t => t.exercises.forEach(n => set.add(n)));
  S.sessions.forEach(s => s.exercises.forEach(e => set.add(e.name)));
  return [...set].sort((a, b) => a.localeCompare(b, 'it'));
}
function prefill(name) {
  const l = lastFor(name);
  if (l && l.sets.length) return l.sets.map(s => ({kg: '', reps: '', pkg: s.kg, preps: s.reps, done: false}));
  return [0, 1, 2].map(() => ({kg: '', reps: '', pkg: null, preps: null, done: false}));
}
function setsText(sets) { return sets.map(s => (s.kg ? fmt(s.kg) : 'corpo libero') + '×' + s.reps).join(' · '); }

/* ---------- viste ---------- */
const views = {
  train() {
    if (S.active) return viewSession();
    const week = S.sessions.filter(s => s.date > Date.now() - 7 * DAY).length;
    const last = S.sessions[S.sessions.length - 1];
    let h = `<div class="card"><div class="stat">
      <div><b>${week}</b><span>ultimi 7 giorni</span></div>
      <div><b>${S.sessions.length}</b><span>allenamenti totali</span></div>
      <div><b>${last ? Math.floor((Date.now() - last.date) / DAY) : '–'}</b><span>giorni dall'ultimo</span></div>
    </div></div><h2 style="margin-top:18px">Inizia un allenamento</h2>`;
    S.templates.forEach(t => {
      const lastT = [...S.sessions].reverse().find(s => s.name === t.name);
      h += `<button class="big" data-a="start" data-t="${t.id}"><span><b>${esc(t.name)}</b><br><span class="small muted">${t.exercises.length} esercizi${lastT ? ' · ultima volta ' + dShort(lastT.date) : ''}</span></span><span class="go">Inizia</span></button>`;
    });
    h += `<button class="btn block" data-a="startfree" style="margin-top:6px">+ Allenamento libero</button>`;
    return h;
  },
  history() {
    if (!S.sessions.length) return `<div class="card muted">Nessun allenamento salvato. Completa il primo dalla scheda <b>Allena</b>.</div>`;
    return [...S.sessions].reverse().map(s => {
      const sets = s.exercises.reduce((a, e) => a + e.sets.length, 0);
      const vol = s.exercises.reduce((a, e) => a + e.sets.reduce((b, x) => b + x.kg * x.reps, 0), 0);
      return `<details class="card"><summary><div class="row between"><div><b>${esc(s.name)}</b><div class="small muted">${dLong(s.date)}</div></div>
        <div class="small muted" style="text-align:right">${s.end ? dur(s.end - s.date) : ''}<br>${sets} serie · ${fmt(vol)} kg</div></div></summary>
        <div style="margin-top:10px">${s.exercises.map(e => `<div class="exline"><span>${esc(e.name)}</span><span class="muted" style="text-align:right">${setsText(e.sets)}</span></div>`).join('')}
        ${s.notes ? `<p class="small muted">📝 ${esc(s.notes)}</p>` : ''}
        <div class="row" style="margin-top:10px"><button class="btn sm danger" data-a="delsession" data-id="${s.id}">Elimina</button></div></div></details>`;
    }).join('');
  },
  progress() {
    const names = [...new Set(S.sessions.flatMap(s => s.exercises.map(e => e.name)))].sort((a, b) => a.localeCompare(b, 'it'));
    let h = '';
    if (!names.length) h += `<div class="card muted">I grafici compariranno dopo il primo allenamento salvato.</div>`;
    else {
      if (!progEx || !names.includes(progEx)) progEx = names[0];
      const pts = exPoints(progEx, progMetric);
      const best = S.sessions.flatMap(s => s.exercises.filter(e => e.name === progEx).flatMap(e => e.sets.map(x => ({...x, date: s.date}))));
      const topKg = best.reduce((a, x) => x.kg > a.kg ? x : a, {kg: 0, reps: 0});
      const topE = best.reduce((a, x) => e1rm(x) > e1rm(a) ? x : a, {kg: 0, reps: 0});
      h += `<div class="card">
        <select id="progEx">${names.map(n => `<option ${n === progEx ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
        <div class="row" style="margin:10px 0">${[['e1', '1RM stimato'], ['kg', 'Carico max'], ['vol', 'Volume']].map(([k, l]) => `<button class="btn sm ${k === progMetric ? 'primary' : ''}" data-a="metric" data-m="${k}">${l}</button>`).join('')}</div>
        <canvas id="chart"></canvas>
        <div class="stat" style="margin-top:12px">
          <div><b>${fmt(e1rm(topE))}</b><span>1RM stimato (kg)</span></div>
          <div><b>${fmt(topKg.kg)}</b><span>carico max ×${topKg.reps}</span></div>
          <div><b>${pts.length}</b><span>sedute</span></div>
        </div>
        <p class="small muted" style="margin-bottom:0">1RM stimato con formula di Epley: kg × (1 + rip/30). È solo un indicatore di progresso, non un invito a testare il massimale.</p>
      </div>`;
    }
    const w = [...S.weights].sort((a, b) => a.date - b.date);
    h += `<div class="card"><h2>Peso corporeo</h2>
      <div class="row"><input id="wkg" class="grow" inputmode="decimal" placeholder="kg (es. 84,6)" style="flex:1"><button class="btn primary" data-a="addweight">Aggiungi</button></div>
      <canvas id="wchart" style="margin-top:12px"></canvas>
      ${w.slice(-6).reverse().map(x => `<div class="list-item"><span class="grow">${dLong(x.date)}</span><b>${fmt(x.kg)} kg</b><button class="del" data-a="delweight" data-id="${x.id}">×</button></div>`).join('')}
    </div>`;
    return h;
  },
  settings() {
    let h = `<h2 style="margin-top:6px">Schede di allenamento</h2>`;
    S.templates.forEach((t, i) => {
      h += `<div class="card">
        <div class="row"><input class="grow" data-tname="${i}" value="${esc(t.name)}" style="flex:1;font-weight:700"><button class="btn sm danger" data-a="tpldel" data-t="${i}">Elimina</button></div>
        <div style="margin-top:8px">${t.exercises.map((n, j) => `<div class="list-item"><span class="grow">${esc(n)}</span>
          <button class="ico" data-a="tplup" data-t="${i}" data-j="${j}">▲</button><button class="ico" data-a="tplrm" data-t="${i}" data-j="${j}">✕</button></div>`).join('')}</div>
        <div class="row" style="margin-top:8px"><input id="tplnew-${i}" list="names" placeholder="Aggiungi esercizio" style="flex:1"><button class="btn" data-a="tpladd" data-t="${i}">+</button></div>
      </div>`;
    });
    h += `<datalist id="names">${knownNames().map(n => `<option value="${esc(n)}">`).join('')}</datalist>
      <button class="btn block" data-a="tplnew">+ Nuova scheda</button>
      <h2 style="margin-top:22px">Recupero</h2>
      <div class="card row"><span class="grow">Timer dopo ogni serie (secondi)</span><input id="rest" type="number" inputmode="numeric" min="0" step="15" value="${S.settings.rest}" style="width:90px;text-align:center"></div>
      <h2 style="margin-top:22px">Privacy</h2>
      <div class="card">
        <p class="small muted" style="margin-top:0">I dati sono salvati solo su questo dispositivo, nel browser. Non vengono inviati a nessun server.</p>
        ${S.settings.pin
          ? `<div class="row between"><span>PIN attivo 🔒</span><button class="btn sm danger" data-a="pinoff">Rimuovi PIN</button></div>`
          : `<div class="row"><input id="pinNew" type="password" inputmode="numeric" placeholder="Nuovo PIN (4–8 cifre)" style="flex:1"><button class="btn" data-a="pinset">Imposta</button></div>`}
        <p class="small muted" style="margin-bottom:0">Il PIN impedisce a chi usa il tuo telefono di aprire l'app. Se lo dimentichi, i dati restano recuperabili solo dal backup.</p>
      </div>
      <h2 style="margin-top:22px">Backup</h2>
      <div class="card">
        <p class="small muted" style="margin-top:0">Esporta un file con tutti i dati: serve per non perderli e per spostarli tra telefono e PC.</p>
        <div class="row"><button class="btn" data-a="export">Scarica backup</button>${navigator.share ? '<button class="btn" data-a="share">Condividi (es. Drive)</button>' : ''}<button class="btn" data-a="import">Importa</button></div>
        <input id="file" type="file" accept="application/json,.json" hidden>
        <div class="row" style="margin-top:10px"><button class="btn sm" data-a="persist">Proteggi dati dalla pulizia automatica</button></div>
      </div>
      <div class="card row between"><span class="small muted">Tracker Allenamenti · v1.0</span><button class="btn sm danger" data-a="wipe">Cancella tutto</button></div>`;
    return h;
  }
};

function viewSession() {
  const a = S.active;
  let h = `<div class="card"><div class="row between"><div><b style="font-size:18px">${esc(a.name)}</b><div class="small muted">Iniziato alle ${new Date(a.start).toLocaleTimeString('it-IT', {hour: '2-digit', minute: '2-digit'})} · <span id="elapsed">${dur(Date.now() - a.start)}</span></div></div>
    <button class="btn primary" data-a="finish">Termina</button></div>
    <p class="small muted" style="margin-bottom:0">Tocca ✓ quando chiudi una serie: se lasci vuoto, vengono usati i valori dell'ultima volta (in grigio).</p></div>`;
  a.exercises.forEach((e, i) => {
    const l = lastFor(e.name);
    h += `<div class="card"><div class="ex-head"><div><b>${esc(e.name)}</b>${l ? `<div class="hint">Ultima volta (${dShort(l.date)}): ${setsText(l.sets)}</div>` : '<div class="hint">Primo allenamento con questo esercizio</div>'}</div>
      <button class="ico" data-a="delex" data-ex="${i}" title="Rimuovi">✕</button></div>
      ${e.sets.map((s, j) => `<div class="set ${s.done ? 'done' : ''}"><span class="n">${j + 1}</span>
        <input inputmode="decimal" data-ex="${i}" data-set="${j}" data-f="kg" value="${esc(s.kg)}" placeholder="${s.pkg != null ? fmt(s.pkg) : 'kg'}">
        <span class="x">×</span>
        <input inputmode="numeric" data-ex="${i}" data-set="${j}" data-f="reps" value="${esc(s.reps)}" placeholder="${s.preps != null ? s.preps : 'rip'}">
        <button class="chk" data-a="done" data-ex="${i}" data-set="${j}">✓</button>
        <button class="del" data-a="delset" data-ex="${i}" data-set="${j}">−</button></div>`).join('')}
      <button class="btn sm" data-a="addset" data-ex="${i}" style="margin-top:4px">+ Serie</button></div>`;
  });
  h += `<div class="card"><div class="row"><input id="newex" list="names" placeholder="Aggiungi esercizio" style="flex:1"><button class="btn" data-a="addex">+</button></div>
    <datalist id="names">${knownNames().map(n => `<option value="${esc(n)}">`).join('')}</datalist>
    <textarea id="notes" rows="2" placeholder="Note (sensazioni, dolori, macchina usata...)" style="margin-top:10px">${esc(a.notes)}</textarea></div>
    <button class="btn block danger" data-a="cancel">Annulla allenamento</button>`;
  return h;
}

function exPoints(name, metric) {
  const pts = [];
  S.sessions.forEach(s => {
    const ex = s.exercises.filter(e => e.name === name);
    if (!ex.length) return;
    const sets = ex.flatMap(e => e.sets);
    let y = 0;
    if (metric === 'kg') y = Math.max(...sets.map(x => x.kg));
    else if (metric === 'vol') y = sets.reduce((a, x) => a + x.kg * x.reps, 0);
    else y = Math.max(...sets.map(e1rm));
    pts.push({x: s.date, y});
  });
  return pts.sort((a, b) => a.x - b.x);
}

function drawChart(cv, pts) {
  if (!cv) return;
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  const c = cv.getContext('2d'); c.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement), col = k => cs.getPropertyValue(k).trim();
  c.clearRect(0, 0, w, h);
  c.font = '12px system-ui,sans-serif';
  if (!pts.length) { c.fillStyle = col('--muted'); c.textAlign = 'center'; c.fillText('Nessun dato ancora', w / 2, h / 2); return; }
  const pl = 42, pr = 12, pt = 12, pb = 24;
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= DAY; x1 += DAY; }
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = (y1 - y0) * 0.15 || Math.max(1, y1 * 0.05); y0 -= pad; y1 += pad;
  const X = x => pl + (x - x0) / (x1 - x0) * (w - pl - pr), Y = y => pt + (1 - (y - y0) / (y1 - y0)) * (h - pt - pb);
  c.strokeStyle = col('--line'); c.fillStyle = col('--muted'); c.lineWidth = 1; c.textAlign = 'right'; c.textBaseline = 'middle';
  for (let i = 0; i <= 3; i++) { const v = y0 + (y1 - y0) * i / 3, yy = Y(v); c.beginPath(); c.moveTo(pl, yy); c.lineTo(w - pr, yy); c.stroke(); c.fillText(fmt(v), pl - 6, yy); }
  c.textBaseline = 'alphabetic';
  c.textAlign = 'left'; c.fillText(dShort(Math.min(...xs)), pl, h - 6);
  if (pts.length > 1) { c.textAlign = 'right'; c.fillText(dShort(Math.max(...xs)), w - pr, h - 6); }
  c.strokeStyle = col('--accent'); c.lineWidth = 2.5; c.lineJoin = 'round'; c.beginPath();
  pts.forEach((p, i) => i ? c.lineTo(X(p.x), Y(p.y)) : c.moveTo(X(p.x), Y(p.y))); c.stroke();
  c.fillStyle = col('--accent');
  pts.forEach(p => { c.beginPath(); c.arc(X(p.x), Y(p.y), 3.5, 0, Math.PI * 2); c.fill(); });
}

/* ---------- render ---------- */
const TITLES = {train: 'Allena', history: 'Storico', progress: 'Progressi', settings: 'Impostazioni'};
const main = document.getElementById('main');
function render() {
  document.getElementById('title').textContent = (tab === 'train' && S.active) ? 'Allenamento in corso' : TITLES[tab];
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  main.innerHTML = views[tab]();
  if (tab === 'progress') {
    if (progEx) drawChart(document.getElementById('chart'), exPoints(progEx, progMetric));
    drawChart(document.getElementById('wchart'), [...S.weights].sort((a, b) => a.date - b.date).map(x => ({x: x.date, y: x.kg})));
  }
}
window.addEventListener('resize', () => { if (tab === 'progress') render(); });

/* ---------- timer recupero ---------- */
let tEnd = 0, tInt = null, ac = null;
const timerEl = document.getElementById('timer');
function startTimer(sec) { if (!sec) return; tEnd = Date.now() + sec * 1000; clearInterval(tInt); tInt = setInterval(tick, 250); tick(); }
function tick() {
  const left = Math.ceil((tEnd - Date.now()) / 1000);
  if (left <= 0) { stopTimer(); buzz(); toast('⏱️ Recupero finito'); return; }
  timerEl.hidden = false; timerEl.querySelector('b').textContent = mmss(left);
}
function stopTimer() { clearInterval(tInt); tInt = null; timerEl.hidden = true; }
function buzz() {
  try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {}
  try { if (!ac) return; const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880; g.gain.value = 0.15; o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.35); } catch (e) {}
}

let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* ---------- PIN ---------- */
async function hashPin(p) {
  const str = 'tracker-salt:' + p;
  try { if (window.crypto && crypto.subtle) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)); return 'sha:' + [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); } } catch (e) {}
  let h = 5381; for (const ch of str) h = ((h << 5) + h + ch.charCodeAt(0)) | 0; return 'djb:' + (h >>> 0).toString(16);
}

/* ---------- azioni ---------- */
function startSession(name, exNames) {
  S.active = {start: Date.now(), name, notes: '', exercises: exNames.map(n => ({name: n, sets: prefill(n)}))};
  save(); render(); window.scrollTo(0, 0);
}
function getSet(b) { return S.active.exercises[+b.dataset.ex].sets[+b.dataset.set]; }

const actions = {
  start(b) { const t = S.templates.find(x => x.id === b.dataset.t); if (t) startSession(t.name, t.exercises); },
  startfree() { startSession('Allenamento libero', []); },
  done(b) {
    try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume && ac.resume(); } catch (e) {}
    const s = getSet(b);
    if (!s.done) {
      if (s.kg === '' && s.pkg != null) s.kg = String(s.pkg).replace('.', ',');
      if (s.reps === '' && s.preps != null) s.reps = String(s.preps);
      if (!num(s.reps)) { toast('Inserisci le ripetizioni'); return; }
      s.done = true; startTimer(+S.settings.rest || 0);
    } else s.done = false;
    save(); render();
  },
  addset(b) {
    const e = S.active.exercises[+b.dataset.ex], l = e.sets[e.sets.length - 1];
    e.sets.push(l ? {kg: '', reps: '', pkg: l.kg !== '' ? num(l.kg) : l.pkg, preps: l.reps !== '' ? num(l.reps) : l.preps, done: false} : {kg: '', reps: '', pkg: null, preps: null, done: false});
    save(); render();
  },
  delset(b) { S.active.exercises[+b.dataset.ex].sets.splice(+b.dataset.set, 1); save(); render(); },
  delex(b) { const e = S.active.exercises[+b.dataset.ex]; if (confirm('Rimuovere "' + e.name + '" da questo allenamento?')) { S.active.exercises.splice(+b.dataset.ex, 1); save(); render(); } },
  addex() { const i = document.getElementById('newex'), n = i.value.trim(); if (!n) return; S.active.exercises.push({name: n, sets: prefill(n)}); save(); render(); },
  cancel() { if (confirm('Annullare l\'allenamento? Le serie inserite andranno perse.')) { S.active = null; stopTimer(); save(); render(); } },
  finish() {
    const a = S.active;
    const ex = a.exercises.map(e => ({name: e.name, sets: e.sets.map(s => ({kg: num(s.kg), reps: Math.round(num(s.reps))})).filter(s => s.reps > 0)})).filter(e => e.sets.length);
    if (!ex.length) { if (confirm('Nessuna serie compilata. Chiudere senza salvare?')) { S.active = null; stopTimer(); save(); render(); } return; }
    const prs = ex.filter(e => { const prev = bestE1(e.name), now = Math.max(...e.sets.map(e1rm)); return prev > 0 && now > prev + 0.01; }).map(e => e.name);
    S.sessions.push({id: uid(), date: a.start, end: Date.now(), name: a.name, exercises: ex, notes: a.notes || ''});
    S.active = null; stopTimer(); save(); tab = 'history'; render(); window.scrollTo(0, 0);
    toast(prs.length ? '🏆 Nuovo record: ' + prs.join(', ') : 'Allenamento salvato 💪');
  },
  delsession(b) { if (confirm('Eliminare questo allenamento dallo storico?')) { S.sessions = S.sessions.filter(s => s.id !== b.dataset.id); save(); render(); } },
  metric(b) { progMetric = b.dataset.m; render(); },
  addweight() { const v = num(document.getElementById('wkg').value); if (v < 20 || v > 400) { toast('Valore non valido'); return; } S.weights.push({id: uid(), date: Date.now(), kg: v}); save(); render(); },
  delweight(b) { S.weights = S.weights.filter(x => x.id !== b.dataset.id); save(); render(); },
  tpldel(b) { const t = S.templates[+b.dataset.t]; if (confirm('Eliminare la scheda "' + t.name + '"? Lo storico non viene toccato.')) { S.templates.splice(+b.dataset.t, 1); save(); render(); } },
  tplup(b) { const ex = S.templates[+b.dataset.t].exercises, j = +b.dataset.j; if (j > 0) { [ex[j - 1], ex[j]] = [ex[j], ex[j - 1]]; save(); render(); } },
  tplrm(b) { S.templates[+b.dataset.t].exercises.splice(+b.dataset.j, 1); save(); render(); },
  tpladd(b) { const i = document.getElementById('tplnew-' + b.dataset.t), n = i.value.trim(); if (!n) return; S.templates[+b.dataset.t].exercises.push(n); save(); render(); },
  tplnew() { S.templates.push({id: uid(), name: 'Nuova scheda', exercises: []}); save(); render(); },
  async pinset() {
    const p = document.getElementById('pinNew').value.trim();
    if (!/^\d{4,8}$/.test(p)) { toast('Il PIN deve avere da 4 a 8 cifre'); return; }
    if (prompt('Ripeti il PIN per conferma') !== p) { toast('I PIN non coincidono'); return; }
    S.settings.pin = await hashPin(p); save(); render(); toast('PIN impostato 🔒');
  },
  pinoff() { if (confirm('Rimuovere il PIN?')) { S.settings.pin = null; save(); render(); } },
  async unlock() {
    const i = document.getElementById('pinIn');
    if (await hashPin(i.value.trim()) === S.settings.pin) { document.getElementById('lock').hidden = true; i.value = ''; render(); }
    else { i.value = ''; toast('PIN errato'); }
  },
  export() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(backupBlob()); a.download = backupName();
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
  async share() {
    const f = new File([backupBlob()], backupName(), {type: 'application/json'});
    try { if (navigator.canShare && navigator.canShare({files: [f]})) await navigator.share({files: [f], title: backupName()}); else actions.export(); } catch (e) {}
  },
  import() { document.getElementById('file').click(); },
  async persist() {
    try { const ok = navigator.storage && navigator.storage.persist && await navigator.storage.persist(); toast(ok ? 'Dati protetti ✅' : 'Il browser non lo consente: fai backup regolari'); } catch (e) { toast('Non supportato su questo browser'); }
  },
  wipe() {
    if (!confirm('Cancellare TUTTI i dati? Operazione irreversibile.')) return;
    if (prompt('Scrivi CANCELLA per confermare') !== 'CANCELLA') return;
    S = normalize(null); save(); tab = 'train'; render(); toast('Dati cancellati');
  },
  t15() { tEnd += 15000; tick(); },
  tstop() { stopTimer(); }
};
function backupBlob() { return new Blob([JSON.stringify(S, null, 2)], {type: 'application/json'}); }
function backupName() { return 'tracker-backup-' + new Date().toISOString().slice(0, 10) + '.json'; }

/* ---------- eventi ---------- */
document.addEventListener('click', e => {
  const nb = e.target.closest('nav button');
  if (nb) { tab = nb.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest('[data-a]');
  if (b && actions[b.dataset.a]) actions[b.dataset.a](b);
});
main.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f && S.active) { getSet(t)[t.dataset.f] = t.value; save(); }
  else if (t.id === 'notes' && S.active) { S.active.notes = t.value; save(); }
});
main.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'progEx') { progEx = t.value; render(); }
  else if (t.dataset.tname != null) { S.templates[+t.dataset.tname].name = t.value.trim() || 'Scheda'; save(); }
  else if (t.id === 'rest') { S.settings.rest = Math.max(0, Math.round(num(t.value))); save(); toast('Recupero: ' + mmss(S.settings.rest)); }
  else if (t.id === 'file' && t.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.sessions)) throw new Error('formato');
        if (!confirm('Importare il backup (' + d.sessions.length + ' allenamenti)? I dati attuali verranno sostituiti.')) return;
        S = normalize(d); save(); render(); toast('Backup importato ✅');
      } catch (err) { toast('File non valido'); }
    };
    r.readAsText(t.files[0]);
  }
});
main.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'newex') actions.addex();
  else if (e.target.id === 'wkg') actions.addweight();
  else if (e.target.id && e.target.id.startsWith('tplnew-')) actions.tpladd({dataset: {t: e.target.id.slice(7)}});
});
document.getElementById('pinIn').addEventListener('keydown', e => { if (e.key === 'Enter') actions.unlock(); });
setInterval(() => { const el = document.getElementById('elapsed'); if (el && S.active) el.textContent = dur(Date.now() - S.active.start); }, 15000);

/* ---------- avvio ---------- */
load();
if (S.settings.pin) document.getElementById('lock').hidden = false;
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
